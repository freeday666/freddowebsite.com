<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bouwlust Drive</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      background: #9ec9e8;
      color: white;
      font: 16px system-ui, sans-serif;
    }
    canvas { display: block; }
    #hud {
      position: fixed;
      top: 14px;
      left: 14px;
      padding: 12px 16px;
      border-radius: 12px;
      background: #101820cc;
      line-height: 1.5;
      user-select: none;
    }
    #help {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      padding: 9px 14px;
      border-radius: 10px;
      background: #101820cc;
      text-align: center;
      font-size: 14px;
      white-space: nowrap;
    }
    #error {
      display: none;
      position: fixed;
      inset: 20px;
      padding: 20px;
      background: #301b1b;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div id="hud">
    <strong>BOUWLUST DRIVE</strong><br>
    Snelheid: <span id="speed">0</span> km/u<br>
    Afstand: <span id="distance">0</span> m
  </div>
  <div id="help">W / ↑ gas &nbsp; S / ↓ rem &nbsp; A/D of ←/→ sturen</div>
  <div id="error">Three.js kon niet laden. Controleer je internetverbinding en laad de pagina opnieuw.</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  (() => {
    if (!window.THREE) {
      document.getElementById("error").style.display = "block";
      return;
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9ec9e8);
    scene.fog = new THREE.Fog(0x9ec9e8, 90, 330);

    const camera = new THREE.PerspectiveCamera(
      65, window.innerWidth / window.innerHeight, 0.1, 500
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x70805e, 1.45));

    const sun = new THREE.DirectionalLight(0xffffff, 1.3);
    sun.position.set(-25, 45, 20);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    scene.add(sun);

    const mat = (color, extra = {}) =>
      new THREE.MeshStandardMaterial({ color, roughness: 0.85, ...extra });

    const grassMat = mat(0x568b48);
    const roadMat = mat(0x34383a);
    const pavementMat = mat(0xaeb1a7);
    const whiteMat = mat(0xf4f0d9);
    const darkMat = mat(0x17191b);
    const houseColors = [0xd8c2a5, 0xcaa989, 0xd5d1c5, 0xb9c5c4, 0xe0d2bb];
    const houseMats = houseColors.map(c => mat(c));
    const windowMat = new THREE.MeshStandardMaterial({
      color: 0x6fabb8, roughness: 0.3, metalness: 0.1
    });

    function box(parent, x, y, z, sx, sy, sz, material) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), material);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    // Ground and road
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), grassMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.12;
    ground.receiveShadow = true;
    scene.add(ground);

    box(scene, 0, -0.01, 0, 12, 0.12, 1000, roadMat);
    box(scene, -7.2, 0.02, 0, 2.4, 0.18, 1000, pavementMat);
    box(scene, 7.2, 0.02, 0, 2.4, 0.18, 1000, pavementMat);

    // Road markings
    for (let z = -490; z < 500; z += 12) {
      box(scene, 0, 0.07, z, 0.16, 0.025, 5, whiteMat);
    }

    // Houses along both sides
    for (let z = -480; z < 500; z += 24) {
      for (const side of [-1, 1]) {
        const group = new THREE.Group();
        const x = side * (12 + Math.random() * 3);
        const width = 7 + Math.random() * 2;
        const height = 5 + Math.random() * 2.4;
        const depth = 11 + Math.random() * 3;
        const color = houseMats[Math.floor(Math.random() * houseMats.length)];

        box(group, 0, height / 2, 0, width, height, depth, color);
        // Flat roof and decorative front door
        box(group, 0, height + 0.12, 0, width + 0.25, 0.25, depth + 0.25, mat(0x554c43));
        box(group, 0, 1.15, side * (depth / 2 + 0.035), 1.1, 2.25, 0.12, mat(0x694b34));

        // Front windows
        for (const wx of [-width * 0.28, width * 0.28]) {
          box(group, wx, 3.1, side * (depth / 2 + 0.04), 1.5, 1.35, 0.12, windowMat);
        }

        group.position.set(x, 0, z + (Math.random() - 0.5) * 5);
        scene.add(group);

        // Small garden trees
        if (Math.random() > 0.35) {
          const tx = x - side * (width / 2 + 2);
          const trunk = new THREE.Mesh(
            new THREE.CylinderGeometry(0.18, 0.24, 2, 7), mat(0x64472d)
          );
          trunk.position.set(tx, 1, z);
          trunk.castShadow = true;
          scene.add(trunk);

          const crown = new THREE.Mesh(
            new THREE.SphereGeometry(1.35, 8, 7), mat(0x397341)
          );
          crown.position.set(tx, 2.45, z);
          crown.castShadow = true;
          scene.add(crown);
        }
      }
    }

    // Car
    const car = new THREE.Group();
    scene.add(car);

    box(car, 0, 0.75, 0, 2.05, 0.65, 4.1, mat(0xc52929, { metalness: 0.18 }));
    box(car, 0, 1.25, -0.25, 1.55, 0.75, 2.15, mat(0xb51f24));
    box(car, 0, 1.3, -0.25, 1.4, 0.58, 1.95, windowMat);

    const wheels = [];
    for (const x of [-1.04, 1.04]) {
      for (const z of [-1.35, 1.35]) {
        const wheel = new THREE.Mesh(
          new THREE.CylinderGeometry(0.39, 0.39, 0.24, 16),
          darkMat
        );
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(x, 0.42, z);
        wheel.castShadow = true;
        car.add(wheel);
        wheels.push(wheel);
      }
    }

    // Headlights and rear lights
    for (const x of [-0.72, 0.72]) {
      box(car, x, 0.86, -2.07, 0.38, 0.22, 0.06, mat(0xfff4cf, {
        emissive: 0x665522
      }));
      box(car, x, 0.86, 2.07, 0.38, 0.22, 0.06, mat(0x8d1111));
    }

    car.position.set(0, 0, 0);

    const keys = Object.create(null);
    window.addEventListener("keydown", e => {
      keys[e.key.toLowerCase()] = true;
      if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(e.key.toLowerCase())) {
        e.preventDefault();
      }
    });
    window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

    let speed = 0;
    let distance = 0;
    let steering = 0;
    const clock = new THREE.Clock();

    function update(dt) {
      const accelerating = keys.w || keys.arrowup;
      const braking = keys.s || keys.arrowdown;
      const left = keys.a || keys.arrowleft;
      const right = keys.d || keys.arrowright;

      if (accelerating) speed += 20 * dt;
      if (braking) speed -= 32 * dt;
      if (!accelerating && !braking) speed *= Math.pow(0.985, dt * 60);

      speed = THREE.MathUtils.clamp(speed, -12, 55);

      const steerInput = (left ? 1 : 0) - (right ? 1 : 0);
      steering += (steerInput - steering) * Math.min(1, dt * 7);

      if (Math.abs(speed) > 0.15) {
        car.position.x += steering * speed * 0.022 * dt * 60;
        car.rotation.y = THREE.MathUtils.clamp(-steering * speed * 0.008, -0.35, 0.35);
        distance += Math.abs(speed) * dt;
      }

      // Keep the car near the road
      car.position.x = THREE.MathUtils.clamp(car.position.x, -5.3, 5.3);
      wheels.forEach(w => {
        w.rotation.x += speed * dt * 1.5;
      });

      camera.position.set(
        car.position.x * 0.72,
        5.3,
        car.position.z + 10.5
      );
      camera.lookAt(car.position.x, 1.1, car.position.z - 5);

      document.getElementById("speed").textContent =
        Math.round(Math.abs(speed) * 3.6);
      document.getElementById("distance").textContent =
        Math.round(distance);
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      car.position.z -= speed * dt;
      update(dt);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  })();
  </script>
</body>
</html>
