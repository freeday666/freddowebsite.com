<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>First-person Street View rijden</title>

  <style>
    * { box-sizing: border-box; }

    html, body, #app {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #111;
    }

    #pano {
      position: absolute;
      inset: 0;
    }

    #topbar {
      position: absolute;
      z-index: 10;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
    }

    #address {
      flex: 1;
      min-width: 0;
      height: 44px;
      padding: 0 12px;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
    }

    #search {
      height: 44px;
      padding: 0 15px;
      border: 0;
      border-radius: 8px;
      background: #1479d1;
      color: white;
      font-weight: bold;
    }

    #status {
      position: absolute;
      z-index: 10;
      top: 66px;
      left: 12px;
      padding: 8px 11px;
      border-radius: 8px;
      color: white;
      background: #000a;
      font-size: 13px;
    }

    /* Stuurwiel onderaan in beeld */
    #wheelArea {
      position: absolute;
      z-index: 8;
      bottom: max(12px, env(safe-area-inset-bottom));
      left: 50%;
      width: 180px;
      height: 180px;
      transform: translateX(-50%);
      pointer-events: none;
    }

    #wheel {
      position: absolute;
      inset: 12px;
      border: 12px solid #171717;
      border-radius: 50%;
      background: #0002;
      box-shadow: 0 4px 14px #0009, inset 0 0 0 2px #777;
      transition: transform 100ms linear;
    }

    #wheel::before,
    #wheel::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 3%;
      width: 9px;
      height: 88%;
      border-radius: 8px;
      background: #222;
      border: 1px solid #666;
      transform: translateX(-50%);
    }

    #wheel::after {
      transform: translateX(-50%) rotate(90deg);
    }

    #wheelHub {
      position: absolute;
      width: 38px;
      height: 38px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 5px solid #222;
      background: #888;
    }

    #controls {
      position: absolute;
      z-index: 11;
      left: 0;
      right: 0;
      bottom: max(22px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: space-between;
      padding: 0 16px;
      pointer-events: none;
    }

    .controlGroup {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .control {
      width: 60px;
      height: 60px;
      border: 2px solid #fff;
      border-radius: 50%;
      color: white;
      background: #111c;
      font-size: 23px;
      font-weight: bold;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .control.pedal {
      width: 66px;
      border-radius: 14px;
      font-size: 13px;
    }

    .control.active {
      background: #1479d1;
    }

    @media (max-width: 390px) {
      #wheelArea {
        width: 145px;
        height: 145px;
        bottom: 10px;
      }

      .control {
        width: 52px;
        height: 52px;
      }

      .control.pedal {
        width: 58px;
      }

      #controls {
        padding: 0 9px;
        bottom: 18px;
      }
    }
  </style>
</head>

<body>
  <main id="app">
    <div id="pano"></div>

    <div id="topbar">
      <input id="address" value="Waikiki Beach, Honolulu" placeholder="Zoek een plaats of adres">
      <button id="search" type="button">Zoek</button>
    </div>

    <div id="status">Google Street View laden…</div>

    <div id="wheelArea" aria-label="Meedraaiend stuurwiel">
      <div id="wheel"><div id="wheelHub"></div></div>
    </div>

    <div id="controls">
      <div class="controlGroup">
        <button class="control" data-control="left" aria-label="Links sturen">◀</button>
        <button class="control" data-control="right" aria-label="Rechts sturen">▶</button>
      </div>
      <div class="controlGroup">
        <button class="control pedal" data-control="brake">REM</button>
        <button class="control pedal" data-control="gas">RIJD</button>
      </div>
    </div>
  </main>

  <script>
    const API_KEY = "JOUW_GOOGLE_MAPS_API_KEY";

    let panorama;
    let speed = 0;
    let lastTime = performance.now();
    let distanceSinceMove = 0;
    let steeringAngle = 0;

    const held = {
      left: false,
      right: false,
      gas: false,
      brake: false
    };

    function setStatus(text) {
      document.getElementById("status").textContent = text;
    }

    function initMap() {
      const start = { lat: 21.2793, lng: -157.8294 };

      panorama = new google.maps.StreetViewPanorama(
        document.getElementById("pano"),
        {
          position: start,
          pov: { heading: 90, pitch: 0 },
          zoom: 0,
          addressControl: false,
          fullscreenControl: true,
          motionTracking: false,
          linksControl: true,
          visible: true
        }
      );

      panorama.addListener("status_changed", () => {
        if (panorama.getStatus() === "OK") {
          setStatus("First-person Street View — houd RIJD ingedrukt");
        } else {
          setStatus("Geen Street View op deze plek. Zoek een andere locatie.");
        }
      });

      const geocoder = new google.maps.Geocoder();

      function searchPlace() {
        const query = document.getElementById("address").value.trim();
        if (!query) return;

        setStatus("Locatie zoeken…");
        geocoder.geocode({ address: query }, (results, status) => {
          if (status === "OK" && results[0]) {
            panorama.setPosition(results[0].geometry.location);
            panorama.setPov({ heading: 90, pitch: 0 });
            setStatus("Locatie gevonden — controleer of Street View beschikbaar is");
          } else {
            setStatus("Locatie niet gevonden. Probeer een ander adres.");
          }
        });
      }

      document.getElementById("search").addEventListener("click", searchPlace);
      document.getElementById("address").addEventListener("keydown", event => {
        if (event.key === "Enter") searchPlace();
      });

      setupControls();
      requestAnimationFrame(tick);
    }

    function setupControls() {
      document.querySelectorAll("[data-control]").forEach(button => {
        const name = button.dataset.control;

        button.addEventListener("pointerdown", event => {
          event.preventDefault();
          button.setPointerCapture(event.pointerId);
          held[name] = true;
          button.classList.add("active");
        });

        function release() {
          held[name] = false;
          button.classList.remove("active");
        }

        button.addEventListener("pointerup", release);
        button.addEventListener("pointercancel", release);
        button.addEventListener("lostpointercapture", release);
      });

      const keys = {
        ArrowLeft: "left", a: "left",
        ArrowRight: "right", d: "right",
        ArrowUp: "gas", w: "gas",
        ArrowDown: "brake", s: "brake"
      };

      window.addEventListener("keydown", event => {
        const name = keys[event.key];
        if (name) {
          event.preventDefault();
          held[name] = true;
        }
      });

      window.addEventListener("keyup", event => {
        const name = keys[event.key];
        if (name) held[name] = false;
      });
    }

    function tick(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (panorama) {
        if (held.gas) speed += 16 * dt;
        else speed -= 7 * dt;
        if (held.brake) speed -= 25 * dt;

        speed = Math.max(0, Math.min(speed, 50));

        const steering = (held.right ? 1 : 0) - (held.left ? 1 : 0);

        // Stuurwiel draait zichtbaar mee:
        steeringAngle += steering * 150 * dt;
        steeringAngle *= Math.pow(0.88, dt * 60);
        document.getElementById("wheel").style.transform =
          `rotate(${steeringAngle}deg)`;

        // First-person kijkrichting draait mee met het stuur.
        if (steering !== 0) {
          const pov = panorama.getPov();
          pov.heading = (pov.heading + steering * 55 * dt + 360) % 360;
          panorama.setPov(pov);
        }

        // Rijdt naar het dichtstbijzijnde Street View-wegpunt
        // in de richting waarin de camera kijkt.
        if (speed > 0.5) {
          distanceSinceMove += speed * dt;

          if (distanceSinceMove > 12) {
            const links = panorama.getLinks();
            const heading = panorama.getPov().heading;

            if (links && links.length) {
              let best = null;
              let bestDifference = Infinity;

              for (const link of links) {
                const difference = Math.abs(
                  ((link.heading - heading + 540) % 360) - 180
                );

                if (difference < bestDifference) {
                  bestDifference = difference;
                  best = link;
                }
              }

              if (best) {
                panorama.setPano(best.pano);
                panorama.setPov({ heading: best.heading, pitch: 0 });
              }
            }

            distanceSinceMove = 0;
          }
        } else {
          distanceSinceMove = 0;
        }

        setStatus(`First-person Street View · ${Math.round(speed)} km/u`);
      }

      requestAnimationFrame(tick);
    }

    const script = document.createElement("script");
    script.src =
      "https://maps.googleapis.com/maps/api/js?key=" +
      encodeURIComponent(API_KEY) +
      "&callback=initMap";
    script.async = true;
    script.defer = true;
    script.onerror = () =>
      setStatus("Maps laden mislukt. Controleer je API-sleutel en instellingen.");
    document.head.appendChild(script);
  </script>
</body>
</html>
