<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Stadsbezorger 3D</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: #101820; font-family: system-ui, Arial, sans-serif;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud { position: fixed; inset: 0; pointer-events: none; color: white; }
    #status, #mission {
      position: absolute; top: 14px; padding: 10px 13px;
      border: 1px solid #ffffff44; border-radius: 11px;
      background: #17212be8; box-shadow: 0 4px 16px #0005;
    }
    #status { left: 14px; font-size: 14px; }
    #mission { right: 14px; width: min(260px, 48vw); }
    #mission strong { display: block; font-size: 12px; letter-spacing: .08em; }
    #mission span { display: block; margin-top: 6px; font-size: 14px; font-weight: 700; }
    #prompt {
      position: absolute; bottom: 21%; left: 50%; transform: translateX(-50%);
      padding: 10px 14px; border-radius: 10px; background: #17212bee;
      font-weight: 700; display: none; text-align: center; white-space: nowrap;
    }
    .controls { position: absolute; bottom: 18px; pointer-events: auto; user-select: none; }
    #steering { left: 16px; display: flex; gap: 10px; }
    #pedals { right: 16px; display: flex; gap: 10px; align-items: end; }
    .btn {
      border: 2px solid #ffffff66; color: white; background: #17212bdd;
      font-weight: 800; box-shadow: 0 3px 10px #0006; touch-action: none;
    }
    .steer {
      width: 66px; height: 66px; border-radius: 50%;
      font-size: 27px;
    }
    .pedal {
      width: 62px; height: 82px; border-radius: 18px; font-size: 14px;
    }
    #action {
      position: absolute; right: 20px; bottom: 118px; width: 62px; height: 62px;
      border-radius: 50%; font-size: 12px; display: none; pointer-events: auto;
    }
    .btn.active { background: #287a43ee; }
    #help {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      font-size: 12px; color: #ffffffcc; text-shadow: 0 1px 3px #000;
      white-space: nowrap; text-align: center;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="status">🚚 In de bestelwagen · 0 km/u</div>
    <div id="mission">
      <strong>BEZORGOPDRACHT</strong>
      <span id="missionText">Rijd naar de groene bestemming</span>
    </div>

    <div id="steering" class="controls">
      <button class="btn steer" data-control="left" aria-label="Links sturen">◀</button>
      <button class="btn steer" data-control="right" aria-label="Rechts sturen">▶</button>
    </div>

    <div id="pedals" class="controls">
      <button class="btn pedal" data-control="brake">REM</button>
      <button class="btn pedal" data-control="throttle">GAS</button>
    </div>

    <button id="action" class="btn">ACTIE</button>
    <div id="prompt"></div>
    <div id="help">WASD/pijltjes: rijden of lopen · E: in/uitstappen · U: laadklep · C: cockpitcamera · Veeg: lopen</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
