<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rotterdam Life - Open World</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
    color: white;
    touch-action: none;
}

#game {
    width: 100vw;
    height: 100vh;
    display: block;
}

#hud {
    position: fixed;
    top: 15px;
    left: 15px;
    background: #101923dd;
    border: 1px solid #ffffff33;
    border-radius: 12px;
    padding: 12px 17px;
    min-width: 180px;
    z-index: 5;
}

#logo {
    color: #ffc64c;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 8px;
}

#money {
    color: #63f0a1;
    font-weight: bold;
}

#vehicleInfo {
    color: #8ed6ff;
    margin-top: 5px;
}

#help {
    position: fixed;
    top: 15px;
    right: 15px;
    background: #101923cc;
    border-radius: 10px;
    padding: 10px;
    font-size: 12px;
    z-index: 5;
}

#controls {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    height: 150px;
    pointer-events: none;
    z-index: 10;
}

#joystick {
    position: absolute;
    left: 25px;
    bottom: 5px;
    width: 125px;
    height: 125px;
    border-radius: 50%;
    background: #ffffff22;
    border: 2px solid #ffffff77;
    pointer-events: auto;
    touch-action: none;
}

#stick {
    position: absolute;
    width: 52px;
    height: 52px;
    left: 34px;
    top: 34px;
    border-radius: 50%;
    background: #ffffffbb;
}

.buttons {
    position: absolute;
    right: 15px;
    bottom: 0;
    display: flex;
    gap: 8px;
    align-items: end;
    pointer-events: auto;
}

button {
    color: white;
    border: 1px solid #ffffff66;
    background: #162536dd;
    border-radius: 13px;
    padding: 13px;
    min-width: 65px;
    font-weight: bold;
    font-size: 12px;
    touch-action: none;
}

button:active {
    background: #247ac2;
}

#message {
    position: fixed;
    top: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: #111d;
    padding: 12px 18px;
    border-radius: 10px;
    display: none;
    z-index: 20;
}

#crosshair {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    color: white;
    font-size: 20px;
    pointer-events: none;
}

@media (min-width: 800px) {
    #controls {
        opacity: .75;
    }
}
</style>
</head>

<body>

<div id="hud">
    <div id="logo">ROTTERDAM LIFE</div>
    <div id="money">Geld: €500</div>
    <div id="vehicleInfo">Te voet</div>
</div>

<div id="help">
    WASD = bewegen<br>
    E = auto in/uit<br>
    C = camera wisselen<br>
    Shift = rennen
</div>

<div id="message"></div>
<div id="crosshair">+</div>

<div id="controls">
    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div class="buttons">
        <button id="cameraBtn">CAMERA</button>
        <button id="enterBtn">INSTAPPEN</button>
        <button id="brakeBtn">REM</button>
        <button id="gasBtn">GAS</button>
    </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";

/* SCENE */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x91b8d0);
scene.fog = new THREE.Fog(0x91b8d0, 180, 650);

const camera = new THREE.PerspectiveCamera(
    70, innerWidth / innerHeight, 0.1, 1200
);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
});

renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
renderer.domElement.id = "game";

scene.add(new THREE.HemisphereLight(0xffffff, 0x52606c, 2));

const sunlight = new THREE.DirectionalLight(0xffffff, 2.5);
sunlight.position.set(100, 180, 80);
sunlight.castShadow = true;
sunlight.shadow.mapSize.set(1024, 1024);
scene.add(sunlight);

/* MATERIALEN */

const mat = (color, roughness = 0.8, metalness = 0) =>
    new THREE.MeshStandardMaterial({
        color, roughness, metalness
    });

const grassMat = mat(0x557b4d);
const roadMat = mat(0x292d32);
const sidewalkMat = mat(0x999b9d);
const whiteMat = mat(0xffffff);
const glassMat = new THREE.MeshStandardMaterial({
    color: 0x6daac0,
    metalness: 0.35,
    roughness: 0.2,
    transparent: true,
    opacity: 0.8
});

/* HULPFUNCTIES */

function box(parent, x, y, z, sx, sy, sz, material) {
    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(sx, sy, sz),
        material
    );
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    parent.add(mesh);
    return mesh;
}

/* GROND EN STAD */

box(scene, 0, -1, 0, 650, 2, 650, grassMat);

function road(x, z, width, length, rotation = 0) {
    const r = box(scene, x, 0.05, z, width, 0.2, length, roadMat);
    r.rotation.y = rotation;

    for (let i = -length / 2 + 10; i < length / 2; i += 22) {
        const line = box(
            scene, x, 0.17, z + i,
            0.35, 0.05, 8, whiteMat
        );
        line.rotation.y = rotation;
    }
}

road(0, 0, 38, 600);
road(0, 0, 38, 600, Math.PI / 2);
road(0, -150, 24, 600);
road(0, 150, 24, 600, Math.PI / 2);

function building(x, z, width, depth, height, color) {
    const group = new THREE.Group();
    group.position.set(x, 0, z);
    scene.add(group);

    box(group, 0, height / 2, 0,
        width, height, depth, mat(color));

    box(group, 0, height + 1, 0,
        width + 1, 2, depth + 1, mat(0x454b52));

    const floors = Math.floor(height / 5);

    for (let f = 0; f < floors; f++) {
        for (let side = -1; side <= 1; side++) {
            box(
                group,
                side * width / 3,
                f * 5 + 3,
                depth / 2 + 0.06,
                2.4, 2.5, 0.12,
                glassMat
            );
        }
    }

    return group;
}

const colors = [
    0xb6a58c, 0xc4c8ca, 0x9babb6,
    0xb5b0a4, 0x777f8b
];

for (let x = -260; x <= 260; x += 65) {
    for (let z = -260; z <= 260; z += 65) {
        if (Math.abs(x) < 35 || Math.abs(z) < 35) continue;

        const height = 18 + Math.random() * 55;
        building(
            x, z, 25 + Math.random() * 12,
            25 + Math.random() * 12,
            height,
            colors[Math.floor(Math.random() * colors.length)]
        );
    }
}

/* ERASMUSBRUG-ACHTIGE BRUG */

const bridge = new THREE.Group();
bridge.position.set(0, 0, -110);
scene.add(bridge);

box(bridge, 0, 9, 0, 150, 2, 13, mat(0x777d84));
box(bridge, 0, 38, 0, 3, 58, 3, mat(0xe5e5e5));

for (let i = -65; i <= 65; i += 13) {
    const cable = new THREE.Mesh(
        new THREE.CylinderGeometry(0.12, 0.12, 35, 6),
        whiteMat
    );
    cable.position.set(i, 26, 0);
    cable.rotation.z = -0.45;
    bridge.add(cable);
}

/* SPELER */

const player = new THREE.Group();
scene.add(player);

const skin = mat(0xd9a77e);
const clothes = mat(0x243e66);
const dark = mat(0x20252b);

const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.48, 0.55, 1.4, 10),
    clothes
);
body.position.y = 1.25;
body.castShadow = true;
player.add(body);

const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.35, 16, 12),
    skin
);
head.position.y = 2.2;
player.add(head);

const leg1 = box(player, -0.2, 0.42, 0, 0.28, 0.85, 0.35, dark);
const leg2 = box(player, 0.2, 0.42, 0, 0.28, 0.85, 0.35, dark);

player.position.set(0, 0, 30);

let yaw = 0;
let pitch = -0.12;
let firstPerson = false;
let driving = false;
let activeCar = null;
let money = 500;

/* AUTO'S */

function makeCar(name, color, x, z, electric = false) {
    const car = new THREE.Group();
    car.position.set(x, 0, z);
    scene.add(car);

    const paint = mat(color, 0.28, 0.65);
    const black = mat(0x171b20, 0.4);
    const lights = mat(0xfff1c4, 0.25);
    const red = mat(0xff2222, 0.3);

    box(car, 0, 1.05, 0, 4.2, 1, 7.5, paint);
    box(car, 0, 1.85, -0.5, 3.5, 1.1, 3.7, glassMat);
    box(car, 0, 1.95, 0.3, 3.55, 0.12, 3.1, paint);

    box(car, 0, 1.1, -3.78, 3.8, 0.25, 0.12, black);

    for (const side of [-1, 1]) {
        for (const end of [-2.4, 2.4]) {
            const wheel = new THREE.Mesh(
                new THREE.CylinderGeometry(0.65, 0.65, 0.45, 20),
                black
            );
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(side * 2, 0.65, end);
            car.add(wheel);
        }
    }

    for (const side of [-1, 1]) {
        box(car, side * 1.4, 1.3, -3.8, 0.65, 0.25, 0.12, lights);
        box(car, side * 1.4, 1.3, 3.8, 0.65, 0.25, 0.12, red);
    }

    car.userData = {
        name,
        speed: 0,
        electric,
        wheels: [],
        maxSpeed: electric ? 60 : 48
    };

    return car;
}

const bmw = makeCar("BMW M4", 0x1556a5, 9, 20, false);
const tesla = makeCar("Tesla Model S", 0xbfc4c8, -9, 20, true);

const cars = [bmw, tesla];

/* CAMERA */

function updateCamera(dt) {
    if (driving && activeCar) {
        const target = activeCar.position.clone();
        target.y += firstPerson ? 2.0 : 4.5;

        if (firstPerson) {
            target.add(
                new THREE.Vector3(0, 0, -0.2)
                .applyQuaternion(activeCar.quaternion)
            );
        } else {
            target.add(
                new THREE.Vector3(0, 2, 11)
                .applyQuaternion(activeCar.quaternion)
            );
        }

        camera.position.lerp(target, Math.min(1, dt * 7));

        const look = activeCar.position.clone();
        look.y += firstPerson ? 2 : 1.5;
        camera.lookAt(look);
    } else {
        const target = player.position.clone();

        if (firstPerson) {
            target.y += 2.3;
            camera.position.copy(target);
            camera.rotation.order = "YXZ";
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
        } else {
            target.y += 2.2;

            const offset = new THREE.Vector3(
                Math.sin(yaw) * 7,
                3.1,
                Math.cos(yaw) * 7
            );

            const desired = target.clone().add(offset);
            camera.position.lerp(desired, Math.min(1, dt * 8));
            camera.lookAt(target);
        }
    }
}

/* BEDIENING */

const keys = {};
let joystickX = 0;
let joystickY = 0;
let gas = false;
let brake = false;

addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;

    if (e.key.toLowerCase() === "c") toggleCamera();
    if (e.key.toLowerCase() === "e") enterCar();
    if (e.key === "Shift") keys.shift = true;
});

addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

function toggleCamera() {
    firstPerson = !firstPerson;
    showMessage(firstPerson ? "First person" : "Third person");
}

document.getElementById("cameraBtn").onclick = toggleCamera;
document.getElementById("enterBtn").onclick = enterCar;

function enterCar() {
    if (driving) {
        driving = false;
        activeCar = null;
        player.visible = true;
        showMessage("Je bent uitgestapt");
        return;
    }

    let closest = null;
    let distance = 999;

    for (const car of cars) {
        const d = player.position.distanceTo(car.position);
        if (d < distance) {
            distance = d;
            closest = car;
        }
    }

    if (closest && distance < 13) {
        activeCar = closest;
        driving = true;
        player.visible = false;
        showMessage("Je rijdt in de " + closest.userData.name);
    } else {
        showMessage("Loop dichter naar een auto");
    }
}

function showMessage(text) {
    const el = document.getElementById("message");
    el.textContent = text;
    el.style.display = "block";
    clearTimeout(showMessage.timer);
    showMessage.timer = setTimeout(() => {
        el.style.display = "none";
    }, 2200);
}

/* JOYSTICK */

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let joystickPointer = null;

joystick.addEventListener("pointerdown", e => {
    joystickPointer = e.pointerId;
    joystick.setPointerCapture(e.pointerId);
    moveStick(e);
});

joystick.addEventListener("pointermove", e => {
    if (e.pointerId === joystickPointer) moveStick(e);
});

function moveStick(e) {
    const rect = joystick.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    let dx = e.clientX - cx;
    let dy = e.clientY - cy;

    const max = 43;
    const length = Math.hypot(dx, dy);

    if (length > max) {
        dx = dx / length * max;
        dy = dy / length * max;
    }

    joystickX = dx / max;
    joystickY = dy / max;

    stick.style.transform = `translate(${dx}px,${dy}px)`;
}

function resetStick() {
    joystickPointer = null;
    joystickX = 0;
    joystickY = 0;
    stick.style.transform = "translate(0,0)";
}

joystick.addEventListener("pointerup", resetStick);
joystick.addEventListener("pointercancel", resetStick);

/* ACTIEKNOPPEN */

function holdButton(id, setter) {
    const el = document.getElementById(id);

    el.addEventListener("pointerdown", e => {
        e.preventDefault();
        setter(true);
    });

    ["pointerup", "pointercancel", "pointerleave"].forEach(event => {
        el.addEventListener(event, () => setter(false));
    });
}

holdButton("gasBtn", v => gas = v);
holdButton("brakeBtn", v => brake = v);

/* CAMERA BEWEGEN MET VINGER */

let lookPointer = null;
let lastX = 0;
let lastY = 0;

renderer.domElement.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" || e.clientX > innerWidth * 0.35) {
        lookPointer = e.pointerId;
        lastX = e.clientX;
        lastY = e.clientY;
    }
});

renderer.domElement.addEventListener("pointermove", e => {
    if (e.pointerId !== lookPointer) return;

    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;

    yaw -= dx * 0.005;
    pitch -= dy * 0.003;
    pitch = THREE.MathUtils.clamp(pitch, -1, 0.8);

    lastX = e.clientX;
    lastY = e.clientY;
});

renderer.domElement.addEventListener("pointerup", () => lookPointer = null);
renderer.domElement.addEventListener("pointercancel", () => lookPointer = null);

/* NPC VOETGANGERS */

const npcs = [];

for (let i = 0; i < 12; i++) {
    const npc = new THREE.Group();

    const npcBody = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.45, 0.8, 4, 8),
        mat([0x344c72, 0x84614c, 0x464646, 0x7d3344][i % 4])
    );
    npcBody.position.y = 1.2;
    npc.add(npcBody);

    const npcHead = new THREE.Mesh(
        new THREE.SphereGeometry(0.28, 12, 10),
        skin
    );
    npcHead.position.y = 2;
    npc.add(npcHead);

    npc.position.set(
        -80 + Math.random() * 160,
        0,
        -80 + Math.random() * 160
    );

    scene.add(npc);

    npcs.push({
        object: npc,
        direction: Math.random() * Math.PI * 2,
        timer: 0
    });
}

/* SPELLOOP */

const clock = new THREE.Clock();
let walkTime = 0;

function animate() {
    requestAnimationFrame(animate);

    const dt = Math.min(clock.getDelta(), 0.04);

    const forward =
        keys.w || keys.arrowup ? 1 :
        keys.s || keys.arrowdown ? -1 : -joystickY;

    const side =
        keys.d || keys.arrowright ? 1 :
        keys.a || keys.arrowleft ? -1 : joystickX;

    if (driving && activeCar) {
        const car = activeCar;
        const data = car.userData;

        let throttle = gas ? 1 : 0;
        let braking = brake ? 1 : 0;

        if (keys.w || keys.arrowup) throttle = 1;
        if (keys.s || keys.arrowdown) braking = 1;

        const steering =
            (keys.d || keys.arrowright ? 1 : 0) -
            (keys.a || keys.arrowleft ? 1 : 0);

        data.speed += throttle * 25 * dt;
        data.speed -= braking * 45 * dt;

        if (throttle === 0 && braking === 0) {
            data.speed *= Math.pow(0.985, dt * 60);
        }

        data.speed = THREE.MathUtils.clamp(
            data.speed, -20, data.maxSpeed
        );

        car.rotation.y -= steering * dt * (0.8 + Math.abs(data.speed) / 35)
            * Math.sign(data.speed || 1);

        const direction = new THREE.Vector3(0, 0, -1)
            .applyQuaternion(car.quaternion);

        car.position.addScaledVector(direction, data.speed * dt);

        player.position.copy(car.position);

        document.getElementById("vehicleInfo").textContent =
            data.name + " | " + Math.round(Math.abs(data.speed) * 3.6) + " km/u";

    } else {
        const moving = Math.abs(forward) + Math.abs(side) > 0.05;

        if (moving) {
            const speed = keys.shift ? 11 : 6;
            const move = new THREE.Vector3(
                side, 0, -forward
            );

            move.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            move.normalize();

            player.position.addScaledVector(move, speed * dt);

            if (!firstPerson) {
                player.rotation.y = Math.atan2(move.x, move.z);
            }

            walkTime += dt * speed * 2;
            leg1.rotation.x = Math.sin(walkTime) * 0.45;
            leg2.rotation.x = -Math.sin(walkTime) * 0.45;
        } else {
            leg1.rotation.x = 0;
            leg2.rotation.x = 0;
        }

        document.getElementById("vehicleInfo").textContent = "Te voet";
    }

    /* NPC BEWEGING */

    for (const npc of npcs) {
        npc.timer -= dt;

        if (npc.timer <= 0) {
            npc.direction += (Math.random() - 0.5) * 2;
            npc.timer = 2 + Math.random() * 4;
        }

        npc.object.position.x += Math.sin(npc.direction) * dt * 1.3;
        npc.object.position.z += Math.cos(npc.direction) * dt * 1.3;
        npc.object.rotation.y = npc.direction;
    }

    document.getElementById("money").textContent =
        "Geld: €" + money;

    updateCamera(dt);
    renderer.render(scene, camera);
}

animate();

/* SCHERMFORMAAT */

addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

showMessage("Welkom in Rotterdam Life!");
</script>
</body>
</html>
