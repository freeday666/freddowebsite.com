<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b12">
  <title>Nova AI — Chat</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      --bg: #090b12;
      --panel: #10131d;
      --panel-light: #171b28;
      --line: rgba(255,255,255,.08);
      --text: #f5f6fa;
      --muted: #9299aa;
      --accent: #a78bfa;
      --accent-2: #67e8f9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% -20%, rgba(124,58,237,.20), transparent 48%),
        var(--bg);
      color: var(--text);
      font: 15px/1.55 "DM Sans", sans-serif;
    }

    button, textarea { font: inherit; }
    button { color: inherit; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
    }

    /* Sidebar */
    .sidebar {
      display: flex;
      flex-direction: column;
      padding: 22px 16px;
      border-right: 1px solid var(--line);
      background: rgba(12,14,22,.78);
      backdrop-filter: blur(20px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 2px 8px 28px;
      font: 700 20px "Space Grotesk", sans-serif;
      letter-spacing: -.7px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, #a78bfa, #6366f1 65%, #22d3ee);
      box-shadow: 0 5px 24px #8b5cf655;
    }

    .brand-mark svg { width: 20px; height: 20px; }

    .new-chat {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 12px;
      border: 1px solid rgba(167,139,250,.35);
      border-radius: 12px;
      background: rgba(139,92,246,.12);
      cursor: pointer;
      transition: .2s ease;
    }

    .new-chat:hover {
      background: rgba(139,92,246,.22);
      border-color: rgba(167,139,250,.65);
      transform: translateY(-1px);
    }

    .side-label {
      margin: 28px 9px 10px;
      color: #747b8d;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 9px;
      color: #aeb4c2;
      font-size: 13px;
    }

    .history-item.active {
      background: rgba(255,255,255,.055);
      color: var(--text);
    }

    .history-item svg { width: 16px; height: 16px; color: #858da0; }

    .sidebar-bottom {
      margin-top: auto;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 7px 3px;
    }

    .avatar {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: linear-gradient(135deg, #334155, #6366f1);
      font-size: 14px;
    }

    .profile-name { font-size: 13px; font-weight: 600; }
    .profile-plan { color: var(--muted); font-size: 11px; }

    /* Main */
    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .topbar {
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 34px;
      border-bottom: 1px solid var(--line);
    }

    .model-select {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #e6e7ed;
      font-weight: 600;
    }

    .model-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #8b5cf6;
      box-shadow: 0 0 12px #8b5cf6;
    }

    .top-actions { display: flex; gap: 9px; }

    .icon-button {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,.025);
      color: #b6bdca;
      cursor: pointer;
      transition: .2s;
    }

    .icon-button:hover { background: var(--panel-light); color: white; }
    .icon-button svg { width: 17px; height: 17px; }

    .conversation {
      width: min(850px, 100%);
      flex: 1;
      margin: 0 auto;
      padding: 48px 28px 28px;
    }

    .welcome {
      padding: 48px 0 28px;
      text-align: center;
      animation: rise .65s both;
    }

    .welcome-orb {
      width: 66px;
      height: 66px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border: 1px solid rgba(196,181,253,.25);
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(139,92,246,.25), rgba(34,211,238,.08));
      box-shadow: 0 0 55px rgba(139,92,246,.16), inset 0 1px rgba(255,255,255,.12);
      animation: float 4s ease-in-out infinite;
    }

    .welcome-orb svg { width: 32px; height: 32px; color: #d8ccff; }

    h1 {
      margin: 0;
      font: 600 clamp(30px, 5vw, 43px)/1.15 "Space Grotesk", sans-serif;
      letter-spacing: -1.8px;
    }

    .gradient-text {
      color: transparent;
      background: linear-gradient(90deg, #c4b5fd, #818cf8 50%, #67e8f9);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .welcome p {
      margin: 13px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 23px 0 34px;
      animation: rise .7s .08s both;
    }

    .suggestion {
      min-height: 78px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(255,255,255,.025);
      text-align: left;
      cursor: pointer;
      transition: .22s ease;
    }

    .suggestion:hover {
      transform: translateY(-2px);
      border-color: rgba(167,139,250,.38);
      background: rgba(139,92,246,.07);
    }

    .suggestion-icon {
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: rgba(167,139,250,.12);
      font-size: 16px;
    }

    .suggestion strong { display: block; font-size: 13px; font-weight: 600; }
    .suggestion small { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }

    #messages { display: flex; flex-direction: column; gap: 22px; }

    .message-row {
      display: flex;
      gap: 12px;
      animation: rise .3s both;
    }

    .message-row.user-row { justify-content: flex-end; }

    .message-avatar {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #171b28;
      color: #c4b5fd;
    }

    .message-avatar svg { width: 16px; height: 16px; }

    .bubble {
      max-width: min(680px, 85%);
      padding: 12px 15px;
      border: 1px solid var(--line);
      border-radius: 4px 14px 14px;
      background: rgba(255,255,255,.035);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user-row .bubble {
      border-color: rgba(129,140,248,.2);
      border-radius: 14px 4px 14px 14px;
      background: rgba(99,102,241,.18);
    }

    .bubble.error { color: #fecaca; }

    .typing { display: flex; gap: 5px; padding: 8px 2px; }
    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #b9a6ff;
      animation: pulse 1s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }

    .composer-wrap {
      position: sticky;
      bottom: 0;
      padding: 18px 28px 24px;
      background: linear-gradient(transparent, var(--bg) 24%);
    }

    .composer {
      width: min(790px, 100%);
      margin: 0 auto;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 17px;
      background: #121520;
      box-shadow: 0 12px 45px #0005, 0 0 0 4px rgba(255,255,255,.015);
      transition: border-color .2s, box-shadow .2s;
    }

    .composer:focus-within {
      border-color: rgba(167,139,250,.45);
      box-shadow: 0 12px 45px #0005, 0 0 0 4px rgba(139,92,246,.07);
    }

    textarea {
      width: 100%;
      min-height: 28px;
      max-height: 150px;
      display: block;
      resize: none;
      padding: 4px 5px 9px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 14px;
    }

    textarea::placeholder { color: #777f91; }

    .composer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .composer-tools { display: flex; gap: 7px; }

    .tool-button {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #9299aa;
      cursor: pointer;
    }

    .tool-button:hover { background: rgba(255,255,255,.07); color: white; }
    .tool-button svg { width: 17px; height: 17px; }

    .send-button {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(135deg, #a78bfa, #6366f1);
      color: white;
      cursor: pointer;
      transition: .2s;
    }

    .send-button:hover { transform: translateY(-1px); filter: brightness(1.12); }
    .send-button:disabled { opacity: .45; cursor: wait; transform: none; }
    .send-button svg { width: 18px; height: 18px; }

    .disclaimer {
      margin: 10px 0 0;
      color: #707789;
      text-align: center;
      font-size: 11px;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes pulse {
      0%, 60%, 100% { opacity: .35; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-4px); }
    }

    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .topbar { height: 58px; padding: 0 18px; }
      .conversation { padding: 24px 17px 15px; }
      .welcome { padding: 38px 0 20px; }
      .suggestions { gap: 8px; }
      .suggestion { padding: 12px; }
      .composer-wrap { padding: 12px 14px 18px; }
    }

    @media (max-width: 480px) {
      .suggestions { grid-template-columns: 1fr; }
      .suggestion { min-height: 65px; }
      .welcome p { font-size: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 2.8l2.1 6.3 6.3 2.1-6.3 2.1-2.1 6.3-2.1-6.3-6.3-2.1 6.3-2.1L12 2.8Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="m19 15 .9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15Z" fill="white"/>
          </svg>
        </span>
        Nova AI
      </div>

      <button class="new-chat" id="new-chat" type="button">
        <span aria-hidden="true">＋</span> Nieuwe chat
      </button>

      <div class="side-label">Recent</div>
      <div class="history-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M7 8h10M7 12h7m-9 8 3.5-3H19a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a3 3 0 0 0 2 3Z"/>
        </svg>
        <span>Nieuwe conversatie</span>
      </div>

      <div class="sidebar-bottom">
        <div class="profile">
          <div class="avatar">✨</div>
          <div>
            <div class="profile-name">Mijn account</div>
            <div class="profile-plan">Nova AI</div>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="model-select"><span class="model-dot"></span> Nova AI <span style="color:#777f91">⌄</span></div>
        <div class="top-actions">
          <button class="icon-button" id="clear-chat" type="button" aria-label="Chat wissen" title="Chat wissen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
              <path d="M4 7h16M10 11v6m4-6v6M5.5 7l1 14h11l1-14M9 7V4h6v3"/>
            </svg>
          </button>
        </div>
      </header>

      <section class="conversation" id="conversation">
        <div class="welcome" id="welcome">
          <div class="welcome-orb" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 2.8l2.1 6.3 6.3 2.1-6.3 2.1-2.1 6.3-2.1-6.3-6.3-2.1 6.3-2.1L12 2.8Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
              <path d="m19 15 .9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15Z" fill="currentColor"/>
            </svg>
          </div>
          <h1>Waar gaan we<br><span class="gradient-text">vandaag mee aan de slag?</span></h1>
          <p>Stel een vraag, verken een idee of maak iets nieuws.</p>
        </div>

        <div class="suggestions" id="suggestions">
          <button class="suggestion" type="button" data-prompt="Geef me vijf creatieve ideeën voor een project.">
            <span class="suggestion-icon">💡</span>
            <span><strong>Brainstorm ideeën</strong><small>Ontdek nieuwe mogelijkheden</small></span>
          </button>
          <button class="suggestion" type="button" data-prompt="Leg een lastig onderwerp eenvoudig uit, met een voorbeeld.">
            <span class="suggestion-icon">🧠</span>
            <span><strong>Leg iets uit</strong><small>Maak complexe dingen helder</small></span>
          </button>
          <button class="suggestion" type="button" data-prompt="Help me een duidelijke en professionele e-mail te schrijven.">
            <span class="suggestion-icon">✍️</span>
            <span><strong>Schrijf met mij</strong><small>Van eerste idee tot eindversie</small></span>
          </button>
          <button class="suggestion" type="button" data-prompt="Help me een probleem stap voor stap op te lossen.">
            <span class="suggestion-icon">🚀</span>
            <span><strong>Los iets op</strong><small>Werk samen naar een oplossing</small></span>
          </button>
        </div>

        <div id="messages" aria-live="polite"></div>
      </section>

      <footer class="composer-wrap">
        <form class="composer" id="chat-form">
          <textarea id="message-input" rows="1" placeholder="Stuur een bericht naar Nova..." aria-label="Je bericht"></textarea>
          <div class="composer-bottom">
            <div class="composer-tools">
              <button class="tool-button" type="button" id="emoji-button" aria-label="Emoji toevoegen" title="Emoji toevoegen">😊</button>
            </div>
            <button class="send-button" id="send-button" type="submit" aria-label="Bericht versturen" title="Versturen">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 19V5m-7 7 7-7 7 7"/>
              </svg>
            </button>
          </div>
        </form>
        <p class="disclaimer">Nova AI kan fouten maken. Controleer belangrijke informatie.</p>
      </footer>
    </main>
  </div>

  <script>
    const form = document.querySelector("#chat-form");
    const input = document.querySelector("#message-input");
    const sendButton = document.querySelector("#send-button");
    const messages = document.querySelector("#messages");
    const welcome = document.querySelector("#welcome");
    const suggestions = document.querySelector("#suggestions");
    const conversation = document.querySelector("#conversation");

    const botIcon = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M12 2.8l2.1 6.3 6.3 2.1-6.3 2.1-2.1 6.3-2.1-6.3-6.3-2.1 6.3-2.1L12 2.8Z" stroke-linejoin="round"/>
        <path d="m19 15 .9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15Z" fill="currentColor" stroke="none"/>
      </svg>`;

    function scrollToBottom() {
      conversation.scrollTop = conversation.scrollHeight;
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    }

    function addMessage(text, role, error = false) {
      const row = document.createElement("div");
      row.className = `message-row ${role === "user" ? "user-row" : ""}`;

      if (role !== "user") {
        const avatar = document.createElement("div");
        avatar.className = "message-avatar";
        avatar.innerHTML = botIcon;
        row.appendChild(avatar);
      }

      const bubble = document.createElement("div");
      bubble.className = `bubble${error ? " error" : ""}`;
      bubble.textContent = text;
      row.appendChild(bubble);
      messages.appendChild(row);
      scrollToBottom();
      return row;
    }

    async function sendMessage(text) {
      const message = text.trim();
      if (!message || sendButton.disabled) return;

      welcome.hidden = true;
      suggestions.hidden = true;
      addMessage(message, "user");

      input.value = "";
      input.style.height = "auto";
      input.disabled = true;
      sendButton.disabled = true;

      const waiting = addMessage("", "assistant");
      const typing = document.createElement("div");
      typing.className = "typing";
      typing.innerHTML = "<span></span><span></span><span></span>";
      waiting.querySelector(".bubble").appendChild(typing);

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const raw = await response.text();
        let data;

        try {
          data = JSON.parse(raw);
        } catch {
          throw new Error(
            `De server gaf geen JSON terug (HTTP ${response.status}). Open Nova via http://localhost:3000.`
          );
        }

        if (!response.ok) {
          throw new Error(data.error || `Serverfout (${response.status}).`);
        }

        waiting.querySelector(".bubble").textContent = data.reply || "Geen antwoord ontvangen.";
      } catch (error) {
        waiting.querySelector(".bubble").classList.add("error");
        waiting.querySelector(".bubble").textContent = error.message || "Er ging iets mis. Probeer het opnieuw.";
      } finally {
        input.disabled = false;
        sendButton.disabled = false;
        input.focus();
        scrollToBottom();
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage(input.value);
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 150) + "px";
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    document.querySelectorAll(".suggestion").forEach((button) => {
      button.addEventListener("click", () => sendMessage(button.dataset.prompt));
    });

    document.querySelector("#new-chat").addEventListener("click", resetChat);
    document.querySelector("#clear-chat").addEventListener("click", resetChat);

    function resetChat() {
      messages.replaceChildren();
      welcome.hidden = false;
      suggestions.hidden = false;
      input.value = "";
      input.focus();
    }

    document.querySelector("#emoji-button").addEventListener("click", () => {
      const start = input.selectionStart;
      const end = input.selectionEnd;
      const emoji = " 😊";
      input.value = input.value.slice(0, start) + emoji + input.value.slice(end);
      input.focus();
      input.setSelectionRange(start + emoji.length, start + emoji.length);
      input.dispatchEvent(new Event("input"));
    });
  </script>
</body>
</html>
