<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oranjestad RP — Truck Game</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; }
    body { background: #17212b; }
    #menu {
      position: fixed; inset: 0; z-index: 10;
      display: grid; place-items: center;
      padding: 20px; background: #101820ee; color: white;
    }
    #panel {
      width: min(440px, 100%); padding: 24px;
      background: #253441; border-radius: 14px;
      box-shadow: 0 12px 40px #0008;
    }
    h1 { margin-top: 0; color: #ff8a32; }
    label { display: block; margin: 14px 0 6px; }
    input {
      width: 100%; padding: 12px; border: 1px solid #71808b;
      border-radius: 7px; background: #fff; color: #111; font-size: 16px;
    }
    button {
      width: 100%; margin-top: 18px; padding: 13px;
      border: 0; border-radius: 7px; background: #f07822;
      color: white; font-size: 17px; font-weight: bold; cursor: pointer;
    }
    button:hover { background: #ff8a32; }
    #error { min-height: 1.3em; color: #ffb3a9; }
    #info {
      display: none; position: fixed; z-index: 2; top: 14px; left: 14px;
      padding: 12px 16px; border-radius: 8px;
      color: white; background: #18232ddd; line-height: 1.5;
    }
    #info strong { color: #ff8a32; }
    gmp-map-3d { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="menu">
    <form id="panel">
      <h1>Oranjestad RP</h1>
      <p>Vul je Google Maps gegevens in om de game te starten.</p>

      <label for="apiKey">Google Maps API-sleutel</label>
      <input id="apiKey" type="password" placeholder="Plak je API-sleutel" required>

      <label for="mapId">Google Maps Map ID</label>
      <input id="mapId" type="text" placeholder="Plak je Map ID" required>

      <button type="submit">Start game</button>
      <p id="error" role="alert"></p>
    </form>
  </div>

  <div id="info">
    <strong>ORANJESTAD RP</strong><br>
    Rijden: W/A/S/D of pijltjestoetsen<br>
    Snelheid: <span id="speed">0</span> km/u
  </div>

  <script src="game.js"></script>
</body>
</html>
