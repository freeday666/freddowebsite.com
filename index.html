<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>European Roads — Rijgame</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #111923;
      color: white;
      font-family: Arial, sans-serif;
      display: grid;
      min-height: 100vh;
      place-items: center;
    }
    #game-wrap {
      width: min(100vw, 960px);
      position: relative;
    }
    canvas {
      display: block;
      width: 100%;
      background: #82b966;
      border: 2px solid #34495e;
    }
    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      pointer-events: none;
      text-shadow: 0 2px 3px #000;
      font-weight: bold;
    }
    #message {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: #07111dcc;
      padding: 24px;
      text-align: center;
    }
    #card {
      max-width: 440px;
      padding: 24px;
      border-radius: 14px;
      background: #1c2a38;
      box-shadow: 0 10px 35px #0008;
    }
    h1 { margin-top: 0; color: #ff9b42; }
    button {
      border: 0;
      border-radius: 8px;
      background: #f07822;
      color: white;
      padding: 12px 22px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    .small { color: #c4d0da; line-height: 1.5; }
    #touch {
      display: none;
      position: absolute;
      bottom: 18px;
      left: 0;
      right: 0;
      justify-content: space-between;
      padding: 0 18px;
    }
    #touch button { width: 68px; height: 58px; padding: 0; opacity: .85; }
    @media (pointer: coarse) {
      #touch { display: flex; }
    }
  </style>
</head>
<body>
  <main id="game-wrap">
    <canvas id="game" width="960" height="600"></canvas>
    <div id="hud">
      <span>EUROPEAN ROADS</span>
      <span>Afstand: <b id="distance">0</b> m</span>
      <span>Snelheid: <b id="speed">0</b> km/u</span>
    </div>

    <div id="message">
      <section id="card">
        <h1>European Roads</h1>
        <p>Rijd met je SUV over een Europese landweg en ontwijk het verkeer.</p>
        <p class="small">Besturing: A/D of ←/→. Op mobiel: gebruik de knoppen.</p>
        <button id="start">Start rijden</button>
      </section>
    </div>

    <div id="touch">
      <button data-dir="-1" aria-label="Links">◀</button>
      <button data-dir="1" aria-label="Rechts">▶</button>
    </div>
  </main>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const distanceEl = document.getElementById("distance");
  const speedEl = document.getElementById("speed");
  const overlay = document.getElementById("message");
  const startButton = document.getElementById("start");

  const W = canvas.width, H = canvas.height;
  const road = { left: 265, right: 695 };
  const player = { x: 480, y: 475, w: 62, h: 112, steer: 0 };
  const keys = {};
  let traffic = [];
  let scenery = [];
  let running = false;
  let lastTime = 0;
  let distance = 0;
  let roadOffset = 0;
  let spawnTimer = 0;
  let speed = 105;

  function reset() {
    player.x = 480;
    traffic = [];
    scenery = [];
    distance = 0;
    roadOffset = 0;
    spawnTimer = 0;
    speed = 105;
    for (let i = 0; i < 12; i++) {
      scenery.push({ y: i * 65, side: i % 2 ? -1 : 1, type: i % 3 });
    }
  }

  function roundedRect(x, y, w, h, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
  }

  function drawCar(x, y, w, h, color, bus = false) {
    // Schaduw
    roundedRect(x - w * .48, y - h * .48 + 5, w * .96, h * .96, 12, "#0005");

    // Banden
    ctx.fillStyle = "#17191c";
    ctx.fillRect(x - w / 2 - 4, y - h * .3, 8, h * .22);
    ctx.fillRect(x + w / 2 - 4, y - h * .3, 8, h * .22);
    ctx.fillRect(x - w / 2 - 4, y + h * .12, 8, h * .22);
    ctx.fillRect(x + w / 2 - 4, y + h * .12, 8, h * .22);

    // Carrosserie
    roundedRect(x - w / 2, y - h / 2, w, h, bus ? 8 : 15, color);

    if (bus) {
      ctx.fillStyle = "#b9e7f3";
      ctx.fillRect(x - w * .39, y - h * .39, w * .78, h * .25);
      ctx.fillStyle = "#f4f0d0";
      for (let i = 0; i < 4; i++) {
        ctx.fillRect(x - w * .39, y - h * .04 + i * 18, w * .78, 12);
      }
      ctx.fillStyle = "#f4db39";
      ctx.fillRect(x - w * .38, y + h * .39, w * .76, 5);
      return;
    }

    // SUV-dak en ramen
    roundedRect(x - w * .36, y - h * .30, w * .72, h * .48, 9, "#273640");
    ctx.fillStyle = "#9ec9d6";
    ctx.beginPath();
    ctx.moveTo(x - w * .29, y - h * .27);
    ctx.lineTo(x + w * .29, y - h * .27);
    ctx.lineTo(x + w * .27, y - h * .07);
    ctx.lineTo(x - w * .27, y - h * .07);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#7fa9b7";
    ctx.fillRect(x - w * .27, y + h * .015, w * .54, h * .12);

    // Koplampen en grille
    ctx.fillStyle = "#fff2b3";
    ctx.fillRect(x - w * .39, y - h * .47, w * .22, 7);
    ctx.fillRect(x + w * .17, y - h * .47, w * .22, 7);
    ctx.fillStyle = "#333b40";
    ctx.fillRect(x - w * .14, y - h * .49, w * .28, 8);
    ctx.fillStyle = "#f54242";
    ctx.fillRect(x - w * .38, y + h * .42, w * .2, 7);
    ctx.fillRect(x + w * .18, y + h * .42, w * .2, 7);
  }

  function drawWorld(dt) {
    ctx.fillStyle = "#83b967";
    ctx.fillRect(0, 0, W, H);

    // Grasstroken en akkers
    for (let y = -80; y < H + 80; y += 120) {
      const yy = (y + roadOffset * .35) % (H + 120);
      ctx.fillStyle = "#719e58";
      ctx.fillRect(35, yy, 130, 52);
      ctx.fillRect(795, yy + 45, 125, 48);
    }

    // Weg en berm
    ctx.fillStyle = "#c9b99b";
    ctx.fillRect(road.left - 24, 0, road.right - road.left + 48, H);
    ctx.fillStyle = "#41464a";
    ctx.fillRect(road.left, 0, road.right - road.left, H);

    // Wegmarkeringen
    ctx.fillStyle = "#f6f0de";
    ctx.fillRect(road.left + 10, 0, 5, H);
    ctx.fillRect(road.right - 15, 0, 5, H);

    // Middenstreepjes
    for (let y = -60; y < H + 60; y += 90) {
      const yy = (y + roadOffset) % (H + 90);
      ctx.fillStyle = "#f5e8c6";
      ctx.fillRect(W / 2 - 3, yy, 6, 45);
    }

    // Bomen en huizen
    for (const item of scenery) {
      item.y += speed * dt * 1.35;
      if (item.y > H + 50) {
        item.y = -50;
        item.side = Math.random() < .5 ? -1 : 1;
        item.type = Math.floor(Math.random() * 3);
      }

      const x = item.side < 0 ? road.left - 75 : road.right + 75;
      if (item.type === 2) {
        ctx.fillStyle = "#b9774d";
        ctx.fillRect(x - 25, item.y - 32, 50, 45);
        ctx.fillStyle = "#933f36";
        ctx.beginPath();
        ctx.moveTo(x - 32, item.y - 32);
        ctx.lineTo(x, item.y - 62);
        ctx.lineTo(x + 32, item.y - 32);
        ctx.fill();
        ctx.fillStyle = "#e5d9ad";
        ctx.fillRect(x - 6, item.y - 12, 12, 25);
      } else {
        ctx.fillStyle = "#60462e";
        ctx.fillRect(x - 5, item.y - 2, 10, 24);
        ctx.fillStyle = item.type === 0 ? "#267c3b" : "#398c45";
        ctx.beginPath();
        ctx.arc(x, item.y - 15, 25, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function spawnTraffic() {
    const lanes = [365, 480, 595];
    const lane = lanes[Math.floor(Math.random() * lanes.length)];
    const isBus = Math.random() < .23;
    traffic.push({
      x: lane + (Math.random() - .5) * 18,
      y: -130,
      w: isBus ? 66 : 54,
      h: isBus ? 145 : 94,
      bus: isBus,
      color: isBus ? "#f2c230" : ["#d74b3f", "#e5e6e2", "#32749a", "#55915a"][Math.floor(Math.random() * 4)],
      speed: isBus ? 42 : 62
    });
  }

  function update(dt) {
    if (!running) return;

    const direction = (keys.ArrowRight || keys.d ? 1 : 0) -
                      (keys.ArrowLeft || keys.a ? 1 : 0);

    player.x += direction * 300 * dt;
    player.x = Math.max(road.left + 45, Math.min(road.right - 45, player.x));

    speed = Math.min(150, speed + 3 * dt);
    roadOffset = (roadOffset + speed * dt * 2.3) % 90;
    distance += speed * dt / 3.6;

    spawnTimer += dt;
    if (spawnTimer > 1.25) {
      spawnTraffic();
      spawnTimer = 0;
    }

    for (const car of traffic) car.y += (speed - car.speed) * dt * 2.1;
    traffic = traffic.filter(car => car.y < H + 160);

    for (const car of traffic) {
      const hitX = Math.abs(car.x - player.x) < (car.w + player.w) * .40;
      const hitY = Math.abs(car.y - player.y) < (car.h + player.h) * .40;
      if (hitX && hitY) endGame();
    }

    distanceEl.textContent = Math.floor(distance);
    speedEl.textContent = Math.round(speed);
  }

  function render(dt) {
    drawWorld(dt);

    for (const car of traffic) {
      drawCar(car.x, car.y, car.w, car.h, car.color, car.bus);
    }

    drawCar(player.x, player.y, player.w, player.h, "#7d858b");
  }

  function frame(time) {
    const dt = Math.min((time - lastTime) / 1000 || 0, 0.04);
    lastTime = time;
    update(dt);
    render(dt);
    requestAnimationFrame(frame);
  }

  function endGame() {
    if (!running) return;
    running = false;
    overlay.style.display = "grid";
    document.querySelector("#card h1").textContent = "Botsing!";
    document.querySelector("#card p").textContent =
      `Je reed ${Math.floor(distance)} meter. Probeer het opnieuw!`;
    startButton.textContent = "Opnieuw rijden";
  }

  startButton.addEventListener("click", () => {
    reset();
    running = true;
    overlay.style.display = "none";
    document.querySelector("#card h1").textContent = "European Roads";
    lastTime = performance.now();
  });

  window.addEventListener("keydown", e => {
    keys[e.key] = true;
    if (["ArrowLeft", "ArrowRight"].includes(e.key)) e.preventDefault();
  });
  window.addEventListener("keyup", e => keys[e.key] = false);

  document.querySelectorAll("#touch button").forEach(button => {
    const dir = Number(button.dataset.dir);
    button.addEventListener("pointerdown", e => {
      e.preventDefault();
      keys[dir < 0 ? "ArrowLeft" : "ArrowRight"] = true;
    });
    for (const eventName of ["pointerup", "pointercancel", "pointerleave"]) {
      button.addEventListener(eventName, () => {
        keys[dir < 0 ? "ArrowLeft" : "ArrowRight"] = false;
      });
    }
  });

  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
