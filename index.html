
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Oranjestad Roleplay</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial;background:#8fc7ed}
#game{position:fixed;inset:0}
#hud{position:fixed;inset:10px;pointer-events:none;color:white}
.panel{background:#102033dc;padding:10px 14px;border-radius:12px;
border:1px solid #ffffff44;text-shadow:0 2px 3px #000}
#brand{position:absolute;top:0;left:0;font-weight:bold}
#speed{position:absolute;right:0;top:0;text-align:center}
#speed strong{display:block;font-size:30px}
#message{position:absolute;top:65px;left:50%;transform:translateX(-50%)}
#map{position:absolute;right:0;top:105px;width:110px;height:110px;
background:#20382d;border:2px solid white;border-radius:10px}
#map canvas{width:100%;height:100%}
#controls{position:fixed;bottom:15px;left:10px;right:10px;
display:flex;justify-content:space-between;align-items:end}
button{border:1px solid #ffffff66;border-radius:13px;
background:#102b43e8;color:white;padding:16px;font-size:17px;
font-weight:bold;touch-action:none}
#gas{background:#087b4c}#brake{background:#a62b35}
#enter{position:fixed;bottom:15px;left:50%;transform:translateX(-50%)}
#start{position:fixed;inset:0;background:#0b1828dd;color:white;
display:flex;align-items:center;justify-content:center;text-align:center}
#start section{max-width:420px;padding:25px}
#start h1{font-size:30px}
#start button{background:#078450}
@media(orientation:portrait) and (pointer:coarse){
 #start section:after{content:"Draai je telefoon horizontaal om te spelen";
 display:block;margin-top:15px;color:#bde9ff}
}
</style>
</head>
<body>

<div id="game"></div>

<div id="hud">
 <div id="brand" class="panel">🇳🇱 ORANJESTAD ROLEPLAY</div>
 <div id="speed" class="panel">
  <strong id="speedValue">0</strong> KM/U
 </div>
 <div id="message" class="panel">Welkom in Oranjestad!</div>
 <div id="map"><canvas id="mapCanvas" width="180" height="180"></canvas></div>
</div>

<button id="enter">E — IN / UITSTAPPEN</button>

<div id="controls">
 <div>
  <button data-control="left">◀</button>
  <button data-control="right">▶</button>
 </div>
 <div>
  <button id="brake" data-control="brake">REM</button>
  <button id="gas" data-control="gas">GAS ▲</button>
 </div>
</div>

<div id="start">
 <section>
  <h1>🇳🇱 Oranjestad Roleplay</h1>
  <p>Welkom in jouw Nederlandse 3D-stad.</p>
  <p>Rijd rond, ontdek de stad en geniet van de rit.</p>
  <p>Computer: WASD of pijltjes. E = instappen. N = dag/nacht.</p>
  <button id="play">START SPELEN</button>
 </section>
</div>

<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x91c9ed);
scene.fog = new THREE.Fog(0x91c9ed,100,450);

const camera = new THREE.PerspectiveCamera(
 65,innerWidth/innerHeight,0.1,800
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.querySelector("#game").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x53634c,2));

const sun = new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-80,100,50);
scene.add(sun);

const material = color =>
 new THREE.MeshStandardMaterial({color,roughness:.85});

function cube(w,h,d,color,x,y,z,parent=scene){
 const obj = new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),material(color)
 );
 obj.position.set(x,y,z);
 obj.castShadow=true;
 obj.receiveShadow=true;
 parent.add(obj);
 return obj;
}

// Stad en gras
const ground = new THREE.Mesh(
 new THREE.PlaneGeometry(600,600),
 material(0x69a75c)
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.1;
scene.add(ground);

// Wegen
for(let i=-2;i<=2;i++){
 cube(15,.12,420,0x343a42,i*70,0,0);
 cube(420,.12,15,0x343a42,0,0,i*70);
}

// Wegmarkeringen
for(let i=-200;i<200;i+=9){
 cube(3,.03,.15,0xffffff,i,.08,0);
 cube(.15,.03,3,0xffffff,0,.08,i);
}

// Huizen
const buildingList=[];
const houseColors=[0xe8d9c1,0xc9d9df,0xe8e5d8,0xd8b59c,0xb7cbd7];

for(let x=-160;x<=160;x+=25){
 for(let z=-160;z<=160;z+=25){
  if(Math.abs(x%70)<16 || Math.abs(z%70)<16) continue;

  const h=6+Math.random()*9;
  const w=8+Math.random()*5;
  const d=8+Math.random()*5;

  cube(w,h,d,
   houseColors[Math.floor(Math.random()*houseColors.length)],
   x,h/2,z
  );

  cube(w+1,.6,d+1,0x984c3b,x,h+.2,z);
  buildingList.push({x,z,w:w+2,d:d+2});
 }
}

// Auto
const car=new THREE.Group();

cube(2.3,.7,4.4,0xe8e8e8,0,.7,0,car);
cube(1.65,.8,2.2,0x263a49,0,1.35,-.2,car);

for(const x of [-1.15,1.15]){
 for(const z of [-1.35,1.35]){
  const wheel=new THREE.Mesh(
   new THREE.CylinderGeometry(.38,.38,.22,12),
   material(0x202329)
  );
  wheel.rotation.z=Math.PI/2;
  wheel.position.set(x,.35,z);
  car.add(wheel);
 }
}

car.position.set(0,0,8);
scene.add(car);

// Verkeersauto's
const traffic=[];
function makeTrafficCar(color,x,z){
 const group=new THREE.Group();
 cube(1.8,.65,3.5,color,0,.6,0,group);
 cube(1.3,.6,1.7,0x354959,0,1,-.2,group);
 group.position.set(x,0,z);
 scene.add(group);
 return group;
}

for(let i=0;i<8;i++){
 const horizontal=i%2===0;
 traffic.push({
  mesh:makeTrafficCar(
   [0x2675bd,0xd5b333,0x37945d,0xb23b3b][i%4],
   horizontal?-160+i*35:(i%3-1)*3,
   horizontal?(i%3-1)*3:-160+i*35
  ),
  horizontal,
  direction:i%4<2?1:-1,
  speed:5+Math.random()*4,
  position:-160+i*35
 });
}

// Besturing
const keys={};
const touch={left:false,right:false,gas:false,brake:false};

addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key.toLowerCase()==="e")toggleDriving();
 if(e.key.toLowerCase()==="n")toggleNight();
});

addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

document.querySelectorAll("[data-control]").forEach(button=>{
 const name=button.dataset.control;
 button.addEventListener("pointerdown",e=>{
  e.preventDefault();
  touch[name]=true;
 });
 ["pointerup","pointercancel","pointerleave"].forEach(event=>{
  button.addEventListener(event,()=>{
   touch[name]=false;
  });
 });
});

let driving=true;
let speed=0;
let rotation=0;
let night=false;

function toggleDriving(){
 driving=!driving;
 speed=0;
 document.querySelector("#message").textContent=
 driving?"Je zit in de auto.":"Je bent uitgestapt.";
}

document.querySelector("#enter").onclick=toggleDriving;

function toggleNight(){
 night=!night;
 scene.background.set(night?0x101b35:0x91c9ed);
 scene.fog.color.copy(scene.background);
 sun.intensity=night?.25:2;
}

document.querySelector("#play").onclick=()=>{
 document.querySelector("#start").style.display="none";
};

function collision(x,z){
 return buildingList.some(b=>
  Math.abs(x-b.x)<b.w/2+1.5 &&
  Math.abs(z-b.z)<b.d/2+2
 );
}

// Minimap
const map=document.querySelector("#mapCanvas").getContext("2d");

function drawMap(){
 map.clearRect(0,0,180,180);
 map.fillStyle="#31533b";
 map.fillRect(0,0,180,180);
 map.strokeStyle="#9ba5aa";
 map.lineWidth=5;

 for(let i=-2;i<=2;i++){
  let p=90+i*18;
  map.beginPath();map.moveTo(p,0);map.lineTo(p,180);map.stroke();
  map.beginPath();map.moveTo(0,p);map.lineTo(180,p);map.stroke();
 }

 map.fillStyle="white";
 map.beginPath();
 map.arc(90+car.position.x*.23,90+car.position.z*.23,5,0,Math.PI*2);
 map.fill();
}

let previous=performance.now();

function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-previous)/1000,.04);
 previous=now;

 const forward=keys.w||keys.arrowup||touch.gas;
 const backward=keys.s||keys.arrowdown||touch.brake;
 const left=keys.a||keys.arrowleft||touch.left;
 const right=keys.d||keys.arrowright||touch.right;

 if(driving){
  if(forward)speed+=17*dt;
  else if(backward)speed-=13*dt;
  else speed*=Math.pow(.985,dt*60);

  speed=THREE.MathUtils.clamp(speed,-9,32);

  const steer=(left?1:0)-(right?1:0);
  rotation+=steer*dt*(.8+Math.abs(speed)/20)*(speed<0?-1:1);

  const nextX=car.position.x+Math.sin(rotation)*speed*dt;
  const nextZ=car.position.z+Math.cos(rotation)*speed*dt;

  if(Math.abs(nextX)<195 && Math.abs(nextZ)<195 &&
     !collision(nextX,nextZ)){
   car.position.x=nextX;
   car.position.z=nextZ;
  }else{
   speed=0;
  }

  car.rotation.y=rotation;
 }

 // Verkeer bewegen
 traffic.forEach(t=>{
  t.position+=t.speed*t.direction*dt;
  if(Math.abs(t.position)>190)t.position=-190*Math.sign(t.position);

  if(t.horizontal){
   t.mesh.position.set(t.position,0,t.mesh.position.z);
   t.mesh.rotation.y=t.direction>0?Math.PI/2:-Math.PI/2;
  }else{
   t.mesh.position.set(t.mesh.position.x,0,t.position);
   t.mesh.rotation.y=t.direction>0?0:Math.PI;
  }
 });

 // Camera achter de auto
 const target=new THREE.Vector3(
  car.position.x-Math.sin(rotation)*9,
  5.5,
  car.position.z-Math.cos(rotation)*9
 );

 camera.position.lerp(target,.12);
 camera.lookAt(car.position.x,1,car.position.z);

 document.querySelector("#speedValue").textContent=
  Math.round(Math.abs(speed)*3.6);

 drawMap();
 renderer.render(scene,camera);
}

camera.position.set(0,8,18);
animate(performance.now());

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
