<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mijn Discord-bot</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111827;
      color: #f9fafb;
      font: 16px system-ui, sans-serif;
    }
    main {
      max-width: 520px;
      padding: 2rem;
      text-align: center;
      background: #1f2937;
      border-radius: 16px;
    }
    a {
      display: inline-block;
      margin-top: 1rem;
      padding: .8rem 1.2rem;
      color: white;
      background: #5865f2;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Welkom!</h1>
    <p>Log veilig in met Discord om verder te gaan.</p>
    <a href="https://discord.com/oauth2/authorize?client_id=CLIENT_ID&response_type=code&redirect_uri=JOUW_URL_ENCODED&scope=identify">
      Inloggen met Discord
    </a>
  </main>
</body>
</html>
