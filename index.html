<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freddo Hosting - Server Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background-color: #1e293b;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #334155;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-list {
            list-style: none;
        }

        .nav-item {
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            color: #94a3b8;
            margin-bottom: 5px;
            transition: all 0.2s;
        }

        .nav-item:hover, .nav-item.active {
            background-color: #334155;
            color: #ffffff;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-online { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
        .status-offline { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
        .status-restarting { background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid #eab308; }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
        }

        .card h3 {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .card .value {
            font-size: 1.8rem;
            font-weight: bold;
        }

        /* Control Buttons */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.85; }
        .btn-start { background-color: #22c55e; color: #000; }
        .btn-stop { background-color: #ef4444; color: #fff; }
        .btn-restart { background-color: #eab308; color: #000; }

        /* Terminal Console */
        .console-card {
            background-color: #020617;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
        }

        .console-logs {
            height: 250px;
            overflow-y: auto;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .log-entry {
            font-size: 0.9rem;
            color: #38bdf8;
        }

        .console-input-group {
            display: flex;
            gap: 10px;
        }

        .console-input {
            flex: 1;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 8px 12px;
            color: #fff;
            font-family: inherit;
        }

        .console-input:focus {
            outline: none;
            border-color: #38bdf8;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="brand">❄️ Freddo Hosting</div>
        <ul class="nav-list">
            <li class="nav-item active">Dashboard</li>
            <li class="nav-item">Console</li>
            <li class="nav-item">Bestanden</li>
            <li class="nav-item">Databases</li>
            <li class="nav-item">Instellingen</li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header">
            <div>
                <h1 id="server-name">Freddo Main Server</h1>
                <p style="color: #64748b; font-size: 0.9rem;">ID: <span id="server-id">srv-01</span></p>
            </div>
            <div id="status-badge" class="status-badge status-online">Online</div>
        </div>

        <!-- Server Acties -->
        <div class="controls">
            <button class="btn btn-start" onclick="sendAction('start')">▶ Start</button>
            <button class="btn btn-stop" onclick="sendAction('stop')">⏹ Stop</button>
            <button class="btn btn-restart" onclick="sendAction('restart')">🔄 Herstart</button>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="card">
                <h3>CPU Gebruik</h3>
                <div class="value" id="cpu-value">0%</div>
            </div>
            <div class="card">
                <h3>RAM Gebruik</h3>
                <div class="value" id="ram-value">0 GB</div>
            </div>
            <div class="card">
                <h3>Opslag</h3>
                <div class="value" id="disk-value">14.2 GB / 50 GB</div>
            </div>
        </div>

        <!-- Interactive Console -->
        <div class="console-card">
            <h3 style="color: #94a3b8; margin-bottom: 10px; font-family: sans-serif;">Live Console</h3>
            <div class="console-logs" id="console-logs">
                <!-- Logs verschijnen hier -->
            </div>
            <div class="console-input-group">
                <input type="text" id="command-input" class="console-input" placeholder="Typ een commando (bijv. 'help', 'status', 'ping')..." onkeydown="if(event.key==='Enter') sendCommand()">
                <button class="btn btn-start" onclick="sendCommand()">Verstuur</button>
            </div>
        </div>
    </div>

    <script>
        // Data ophalen uit Express API
        async function fetchStatus() {
            try {
                const res = await fetch('/api/server/status');
                const data = await res.json();

                document.getElementById('cpu-value').innerText = data.cpu + '%';
                document.getElementById('ram-value').innerText = data.ram + ' GB';

                const badge = document.getElementById('status-badge');
                badge.innerText = data.status.toUpperCase();
                badge.className = `status-badge status-${data.status}`;
            } catch (err) {
                console.error("Fout bij ophalen status:", err);
            }
        }

        async function fetchLogs() {
            try {
                const res = await fetch('/api/server/logs');
                const logs = await res.json();
                const logContainer = document.getElementById('console-logs');
                
                logContainer.innerHTML = logs.map(log => 
                    `<div class="log-entry"><span style="color:#64748b">[${log.timestamp}]</span> ${log.text}</div>`
                ).join('');
                
                logContainer.scrollTop = logContainer.scrollHeight;
            } catch (err) {
                console.error("Fout bij ophalen logs:", err);
            }
        }

        async function sendAction(action) {
            await fetch('/api/server/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action })
            });
            fetchStatus();
            fetchLogs();
        }

        async function sendCommand() {
            const input = document.getElementById('command-input');
            const command = input.value.trim();
            if (!command) return;

            await fetch('/api/server/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command })
            });

            input.value = '';
            fetchLogs();
        }

        // Automatisch verversen van data (elke 2 seconden)
        setInterval(() => {
            fetchStatus();
            fetchLogs();
        }, 2000);

        // Initiële laadactie
        fetchStatus();
        fetchLogs();
    </script>
</body>
</html>
