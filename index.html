<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Rijden langs de kust</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    #game {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #70b9e6 url("cabine.jpg") center center / cover no-repeat;
    }

    /* De cabine blijft op zijn plek; alleen het uitzicht beweegt. */
    #view {
      position: absolute;
      top: 0;
      left: 18%;
      width: 82%;
      height: 66%;
      overflow: hidden;
      clip-path: polygon(0 0, 100% 0, 100% 83%, 18% 100%);
      pointer-events: none;
    }

    #scenery {
      position: absolute;
      inset: -8%;
      background:
        linear-gradient(to bottom,
          #69b5e8 0%, #94d2f0 45%,
          #268bb1 46%, #16789c 60%,
          #77715e 61%, #343434 100%);
      transform: perspective(500px);
    }

    .road {
      position: absolute;
      left: 16%;
      bottom: -5%;
      width: 66%;
      height: 66%;
      background: #45494b;
      clip-path: polygon(43% 0, 57% 0, 100% 100%, 0 100%);
    }

    .road::before {
      content: "";
      position: absolute;
      left: 49%;
      top: 0;
      width: 2%;
      height: 100%;
      background: repeating-linear-gradient(
        to bottom, #f5e8b3 0 28px, transparent 28px 54px
      );
      transform: perspective(120px) rotateX(20deg);
      transform-origin: top;
    }

    .shore {
      position: absolute;
      bottom: 22%;
      left: -4%;
      width: 40%;
      height: 13%;
      background: #ddc99a;
      transform: rotate(-5deg);
    }

    .palm {
      position: absolute;
      bottom: 37%;
      width: 5px;
      height: 100px;
      background: #725238;
      transform-origin: bottom;
    }

    .palm::before {
      content: "🌴";
      position: absolute;
      top: -35px;
      left: -23px;
      font-size: 43px;
    }

    .house {
      position: absolute;
      right: 2%;
      bottom: 28%;
      width: 23%;
      height: 27%;
      background: #5bc3a4;
      border: 5px solid #f4eee0;
      box-shadow: 0 6px 0 #d67874;
    }

    .house::before {
      content: "";
      position: absolute;
      left: -8%;
      top: -28%;
      width: 116%;
      height: 30%;
      background: #dd745c;
      clip-path: polygon(10% 0, 90% 0, 100% 100%, 0 100%);
    }

    .car {
      position: absolute;
      left: 53%;
      bottom: 29%;
      width: 8%;
      height: 12%;
      border-radius: 12px 12px 5px 5px;
      background: #eee;
      border: 3px solid #bbb;
      box-shadow: 0 4px 5px #333;
    }

    .car::before {
      content: "";
      position: absolute;
      left: 17%;
      top: -34%;
      width: 66%;
      height: 40%;
      border-radius: 8px 8px 0 0;
      background: #b7d7e4;
      border: 2px solid #aaa;
    }

    #hud {
      position: absolute;
      top: 12px;
      right: 12px;
      color: white;
      background: #0009;
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 14px;
      z-index: 5;
    }

    #controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: end;
      padding: 0 18px;
      z-index: 10;
      pointer-events: none;
    }

    .group {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }

    button {
      width: 68px;
      height: 68px;
      border: 2px solid #ffffffaa;
      border-radius: 50%;
      color: white;
      background: #111a;
      font-size: 28px;
      font-weight: bold;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      box-shadow: 0 3px 10px #0006;
    }

    button:active, button.active {
      background: #28a9df;
      transform: scale(.94);
    }

    .pedal {
      width: 76px;
      height: 76px;
      font-size: 15px;
      border-radius: 18px;
    }

    #help {
      position: absolute;
      left: 50%;
      top: 12px;
      transform: translateX(-50%);
      padding: 8px 12px;
      border-radius: 10px;
      color: white;
      background: #0008;
      font-size: 13px;
      text-align: center;
      z-index: 5;
    }

    @media (min-width: 800px) {
      button { width: 76px; height: 76px; }
      .pedal { width: 86px; height: 76px; }
    }
  </style>
</head>
<body>
  <main id="game">
    <div id="view">
      <div id="scenery">
        <div class="shore"></div>
        <div class="road"></div>
        <div class="house"></div>
        <div class="car"></div>
        <div class="palm" style="left:12%; height:85px"></div>
        <div class="palm" style="left:24%; height:120px"></div>
        <div class="palm" style="left:36%; height:95px"></div>
        <div class="palm" style="left:77%; height:110px"></div>
      </div>
    </div>

    <div id="help">Tik of houd de knoppen ingedrukt om te rijden</div>
    <div id="hud">Snelheid: <span id="speed">0</span> km/u</div>

    <div id="controls">
      <div class="group">
        <button data-control="left" aria-label="Links">◀</button>
        <button data-control="right" aria-label="Rechts">▶</button>
      </div>
      <div class="group">
        <button class="pedal" data-control="brake">REM</button>
        <button class="pedal" data-control="gas">GAS</button>
      </div>
    </div>
  </main>

  <script>
    const scenery = document.getElementById("scenery");
    const speedText = document.getElementById("speed");
    const buttons = document.querySelectorAll("[data-control]");

    const held = { left: false, right: false, gas: false, brake: false };
    let speed = 0;
    let offsetX = 0;
    let offsetY = 0;
    let lastTime = performance.now();

    function setControl(name, value) {
      held[name] = value;
      const button = document.querySelector(`[data-control="${name}"]`);
      if (button) button.classList.toggle("active", value);
    }

    buttons.forEach(button => {
      const name = button.dataset.control;

      button.addEventListener("pointerdown", event => {
        event.preventDefault();
        button.setPointerCapture(event.pointerId);
        setControl(name, true);
      });

      ["pointerup", "pointercancel", "lostpointercapture"].forEach(type => {
        button.addEventListener(type, () => setControl(name, false));
      });
    });

    // Toetsenbordbediening voor computer.
    window.addEventListener("keydown", event => {
      const keys = {
        ArrowLeft: "left", a: "left",
        ArrowRight: "right", d: "right",
        ArrowUp: "gas", w: "gas",
        ArrowDown: "brake", s: "brake"
      };
      if (keys[event.key]) {
        event.preventDefault();
        setControl(keys[event.key], true);
      }
    });

    window.addEventListener("keyup", event => {
      const keys = {
        ArrowLeft: "left", a: "left",
        ArrowRight: "right", d: "right",
        ArrowUp: "gas", w: "gas",
        ArrowDown: "brake", s: "brake"
      };
      if (keys[event.key]) setControl(keys[event.key], false);
    });

    function frame(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (held.gas) speed += 32 * dt;
      else speed -= 9 * dt;

      if (held.brake) speed -= 55 * dt;
      speed = Math.max(0, Math.min(120, speed));

      const steering = (held.right ? 1 : 0) - (held.left ? 1 : 0);
      offsetX -= steering * (35 + speed * 1.1) * dt;
      offsetY += speed * 0.13 * dt;

      scenery.style.transform =
        `translate(${offsetX}px, ${Math.sin(offsetY) * 5}px) scale(${1 + speed / 900})`;

      speedText.textContent = Math.round(speed);
      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  </script>
</body>
</html>
