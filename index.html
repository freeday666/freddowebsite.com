<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SWAT — Breach Training</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111820;font-family:Arial,sans-serif;touch-action:none}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .top{position:fixed;inset:12px 12px auto;display:flex;justify-content:space-between;color:#fff;text-shadow:0 2px 4px #000;pointer-events:none}
  .badge{background:#111c;color:white;border:1px solid #ffffff55;border-radius:9px;padding:8px 11px;font-size:12px}
  .controls{position:fixed;inset:0;pointer-events:none}
  button{pointer-events:auto;color:white;background:#16212dcc;border:2px solid #ffffff66;border-radius:50%;font-weight:bold;font-size:13px;touch-action:none;user-select:none;-webkit-user-select:none}
  button:active,.on{background:#347b70dd}
  #move{position:absolute;left:20px;bottom:25px;width:132px;height:132px;border-radius:50%;opacity:.88}
  #fire{position:absolute;right:22px;bottom:32px;width:76px;height:76px;background:#8d302ddd}
  #reload{position:absolute;right:110px;bottom:42px;width:60px;height:60px}
  #aim{position:absolute;right:25px;bottom:122px;width:58px;height:58px}
  #message{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;background:#101820dd;padding:18px 22px;border:1px solid #fff6;border-radius:12px;text-align:center;display:none}
  .cross{position:fixed;left:50%;top:50%;width:24px;height:24px;transform:translate(-50%,-50%);pointer-events:none}
  .cross:before,.cross:after{content:"";position:absolute;background:#d8e6df;box-shadow:0 0 3px #000}
  .cross:before{width:2px;height:24px;left:11px}
  .cross:after{height:2px;width:24px;top:11px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="top">
  <div class="badge">SWAT · BREACH TRAINING<br><span id="objective">DOEL: beveilig de ruimte</span></div>
  <div class="badge"><span id="health">❤ 100</span><br><span id="ammo">AMMO 12 / 48</span></div>
</div>
<div class="cross"></div>
<div class="controls">
  <button id="move">INZETTEN<br>HOUD VAST</button>
  <button id="aim">RICHTEN</button>
  <button id="reload">HERLADEN</button>
  <button id="fire">VUUR</button>
</div>
<div id="message"></div>

<script>
(()=>{
const canvas=document.querySelector("#c"),ctx=canvas.getContext("2d");
const ammoEl=document.querySelector("#ammo"),healthEl=document.querySelector("#health");
const objective=document.querySelector("#objective"),message=document.querySelector("#message");
let W,H,D,move=false,aiming=false,ammo=12,reserve=48,health=100,score=0;
let yaw=0,recoil=0,flash=0,gameOver=false,last=performance.now(),time=0;
let enemies=[
 {x:-1.3,z:7,hp:2,alive:true,phase:0},
 {x:1.6,z:10,hp:2,alive:true,phase:2},
 {x:.1,z:14,hp:2,alive:true,phase:4}
];
function resize(){
 D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0);
}
addEventListener("resize",resize);resize();

function hold(id,fn){
 const b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{e.preventDefault();b.setPointerCapture(e.pointerId);fn(true);b.classList.add("on")});
 const end=e=>{e.preventDefault();fn(false);b.classList.remove("on")};
 b.addEventListener("pointerup",end);b.addEventListener("pointercancel",end);
}
hold("move",v=>move=v);
hold("aim",v=>aiming=v);

let dragging=false,lastX=0;
canvas.addEventListener("pointerdown",e=>{
 if(e.clientX>W*.38){dragging=true;lastX=e.clientX;canvas.setPointerCapture(e.pointerId)}
});
canvas.addEventListener("pointermove",e=>{
 if(dragging){yaw+=(e.clientX-lastX)*.005;lastX=e.clientX}
});
canvas.addEventListener("pointerup",()=>dragging=false);
canvas.addEventListener("pointercancel",()=>dragging=false);

document.querySelector("#fire").addEventListener("pointerdown",e=>{e.preventDefault();shoot()});
document.querySelector("#reload").addEventListener("click",reload);
function reload(){
 if(ammo<12&&reserve>0&&!gameOver){
   const n=Math.min(12-ammo,reserve);ammo+=n;reserve-=n;updateHUD();
 }
}
function updateHUD(){
 ammoEl.textContent=`AMMO ${ammo} / ${reserve}`;
 healthEl.textContent=`❤ ${health}`;
 objective.textContent=score>=enemies.length?"DOEL: ruimte beveiligd":"DOEL: beveilig de ruimte · "+score+"/"+enemies.length;
}
function shoot(){
 if(gameOver)return;
 if(ammo<=0){reload();return}
 ammo--;flash=1;recoil=1;updateHUD();
 const alive=enemies.filter(e=>e.alive);
 if(alive.length){
   alive.sort((a,b)=>Math.abs(a.x-yaw*.8)-Math.abs(b.x-yaw*.8));
   const e=alive[0];
   if(Math.abs(e.x-yaw*.8)<.72){
     e.hp--;if(e.hp<=0){e.alive=false;score++;updateHUD()}
   }
 }
}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function polygon(points,c){
 ctx.fillStyle=c;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill();
}
function drawSoldier(e){
 const z=e.z, x=W/2+(e.x
