<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Street View rijden</title>
  <style>
    * { box-sizing: border-box }
    body { margin: 0; font: 16px system-ui, sans-serif; background: #111; color: white }
    header { padding: 12px; display: flex; gap: 8px; background: #202124 }
    input { flex: 1; min-width: 0; padding: 12px; font-size: 16px; border-radius: 8px; border: 0 }
    button { padding: 11px 14px; border: 0; border-radius: 8px; background: #4285f4; color: white; font-size: 15px }
    iframe { display: block; width: 100%; height: calc(100vh - 125px); border: 0 }
    footer { min-height: 58px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px }
    #status { position: fixed; left: 12px; bottom: 72px; background: #000c; padding: 8px 12px; border-radius: 8px }
    @media(max-width:600px) {
      header { flex-wrap: wrap }
      input { flex-basis: 100% }
      iframe { height: calc(100vh - 175px) }
      footer { gap: 6px }
      button { padding: 10px }
    }
  </style>
</head>
<body>
  <header>
    <input id="place" placeholder="Adres, plaats of Google Maps-link" value="Eiffel Tower, Paris">
    <button id="search">Zoek / laad</button>
    <button id="open">Open in Google Maps</button>
  </header>

  <iframe
    id="map"
    title="Google Maps Street View"
    allowfullscreen
    loading="eager"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>

  <div id="status">Zoek een plek en gebruik daarna de Street View-bediening in de kaart.</div>

  <footer>
    <button id="left">◀ Links</button>
    <button id="back">Achteruit</button>
    <button id="forward">Vooruit</button>
    <button id="right">Rechts ▶</button>
  </footer>

  <script>
    const input = document.getElementById("place");
    const frame = document.getElementById("map");
    const status = document.getElementById("status");

    function mapsUrl(value) {
      const q = encodeURIComponent(value.trim());
      return `https://www.google.com/maps?q=${q}&layer=c`;
    }

    function loadPlace() {
      const query = input.value.trim();
      if (!query) {
        status.textContent = "Vul eerst een adres, plaats of Maps-link in.";
        return;
      }

      // Maps-link rechtstreeks openen als externe link; anders zoekterm/adres gebruiken.
      const isMapsLink = /^https?:\/\/(www\.)?google\.[^/]+\/maps/i.test(query);
      frame.src = isMapsLink
        ? query.replace(/^http:/, "https:")
        : mapsUrl(query);

      status.textContent =
        "Kaart geladen. Kies in Google Maps een Street View-blauwe lijn of sleep het Pegman-poppetje naar een weg.";
    }

    document.getElementById("search").addEventListener("click", loadPlace);
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") loadPlace();
    });

    document.getElementById("open").addEventListener("click", () => {
      const query = input.value.trim();
      if (query) window.open(mapsUrl(query), "_blank", "noopener");
    });

    // Google Maps laat externe pagina's niet toe om de panorama's te besturen.
    // Deze knoppen openen daarom de kaart; rij met Maps' eigen Street View-pijlen.
    for (const id of ["left", "right", "forward", "back"]) {
      document.getElementById(id).addEventListener("click", () => {
        status.textContent =
          "Gebruik de pijlen in Street View zelf om tussen panorama's te bewegen. Externe knoppen kunnen Google Maps niet besturen.";
      });
    }

    loadPlace();
  </script>
</body>
</html>
