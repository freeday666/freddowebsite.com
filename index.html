<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Satellietrit</title>
<style>
  * { box-sizing: border-box }
  html, body { height:100%; margin:0; overflow:hidden; background:#101418;
    color:#fff; font-family:system-ui,Arial,sans-serif; touch-action:none }
  #map { position:absolute; inset:0 }
  #message { position:absolute; z-index:2; top:12px; left:12px; right:12px;
    padding:10px 12px; border-radius:12px; background:#101820df; font-size:13px }
  #message.error { background:#752929eF }
  #car { position:absolute; z-index:1; left:50%; top:50%; width:70px; height:112px;
    transform:translate(-50%,-50%); filter:drop-shadow(0 5px 5px #000a); pointer-events:none }
  #dashboard { position:absolute; z-index:2; bottom:0; left:0; right:0;
    min-height:155px; padding:12px 14px max(14px, env(safe-area-inset-bottom));
    border-radius:20px 20px 0 0; background:linear-gradient(#1c2329f2,#080b0ff7);
    border-top:1px solid #ffffff30 }
  .dashTop { display:flex; justify-content:space-between; align-items:center; gap:12px }
  .screen { flex:1; min-height:54px; border:1px solid #ffffff22; border-radius:12px;
    padding:8px 11px; background:#101820; color:#bfeaff }
  .speed { min-width:82px; text-align:center; font-size:25px; font-weight:700 }
  .speed small { display:block; font-size:11px; color:#aab4bd; font-weight:400 }
  .controls { display:flex; justify-content:space-between; align-items:center; margin-top:10px }
  .group { display:flex; gap:10px }
  button { width:56px; height:48px; border:1px solid #ffffff45; border-radius:14px;
    color:white; background:#ffffff1b; font-size:21px; font-weight:700;
    touch-action:none; user-select:none }
  button:active { background:#168de5 }
  .pedal { width:64px; font-size:13px }
  .hint { color:#aeb8c1; font-size:11px; text-align:center }
</style>
</head>
<body>
<div id="map"></div>

<div id="message">Kaart laden… Vervang eerst de API-sleutel in de HTML.</div>

<!-- Zelfgetekende elektrische auto, geen officieel Tesla-model -->
<svg id="car" viewBox="0 0 70 112" aria-label="Auto">
  <ellipse cx="35" cy="57" rx="27" ry="48" fill="#090b0d"/>
  <path d="M19 14 Q22 5 35 5 Q48 5 51 14 L59 35 L60 83 Q57 103 35 107 Q13 103 10 83 L11 35Z"
        fill="#d9e0e5" stroke="#fff" stroke-width="2"/>
  <path d="M20 26 Q23 17 35 16 Q47 17 50 26 L54 43 L16 43Z"
        fill="#253e4d" stroke="#9dd9f2" stroke-width="1"/>
  <path d="M15 49 Q35 45 55 49 L53 77 Q35 83 17 77Z" fill="#252d32"/>
  <path d="M19 82 Q35 87 51 82 L47 96 Q35 102 23 96Z" fill="#bfcbd1"/>
  <path d="M15 12 L24 15 M55 12 L46 15" stroke="#fff1b3" stroke-width="4" stroke-linecap="round"/>
  <path d="M13 91 L20 94 M57 91 L50 94" stroke="#d32f2f" stroke-width="4" stroke-linecap="round"/>
</svg>

<section id="dashboard">
  <div class="dashTop">
    <div class="screen">⚡ ELEKTRISCH<br><span id="status">Klaar om te rijden</span></div>
    <div class="speed"><span id="speed">0</span><small>km/u</small></div>
  </div>
  <div class="controls">
    <div class="group">
      <button data-control="left" aria-label="Links">◀</button>
      <button data-control="right" aria-label="Rechts">▶</button>
    </div>
    <div class="hint">Houd ingedrukt<br>om te besturen</div>
    <div class="group">
      <button class="pedal" data-control="brake">REM</button>
      <button class="pedal" data-control="gas">GAS</button>
    </div>
  </div>
</section>

<script>
const API_KEY = "VUL_HIER_JE_API_SLEUTEL_IN";
// Pas dit startpunt eventueel aan: latitude, longitude.
const START = { lat: 52.3676, lng: 4.9041 }; // Amsterdam

const message = document.getElementById("message");
const statusText = document.getElementById("status");
const controls = { left:false, right:false, gas:false, brake:false };
let map, marker, speed = 0, heading = 0;
const position = { ...START };

document.querySelectorAll("[data-control]").forEach(button => {
  const name = button.dataset.control;
  const down = e => { e.preventDefault(); controls[name] = true; };
  const up = e => { e.preventDefault(); controls[name] = false; };
  button.addEventListener("pointerdown", down);
  button.addEventListener("pointerup", up);
  button.addEventListener("pointercancel", up);
  button.addEventListener("pointerleave", up);
});

function loadMap() {
  if (!API_KEY || API_KEY.includes("VUL_HIER")) {
    message.classList.add("error");
    message.textContent = "Vul je Google Maps API-sleutel in de regel API_KEY bovenaan de code in.";
    return;
  }
  const script = document.createElement("script");
  script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(API_KEY)}&callback=initMap`;
  script.async = true;
  script.onerror = () => {
    message.classList.add("error");
    message.textContent = "Google Maps kon niet laden. Controleer je API-sleutel, facturering en toegestane website-referrer.";
  };
  document.head.appendChild(script);
}

window.initMap = function() {
  map = new google.maps.Map(document.getElementById("map"), {
    center: position,
    zoom: 18,
    mapTypeId: "satellite",
    tilt: 0,
    disableDefaultUI: true,
    gestureHandling: "greedy"
  });

  marker = new google.maps.Marker({
    position,
    map,
    title: "Jouw auto",
    icon: {
      path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW,
      scale: 5,
      fillColor: "#ef3d3d",
      fillOpacity: 1,
      strokeColor: "#ffffff",
      strokeWeight: 2,
      rotation: heading
    }
  });

  message.textContent = "Satellietkaart geladen · demo-auto";
  setTimeout(() => message.remove(), 3500);
};

function tick() {
  if (controls.gas) speed = Math.min(speed + 0.18, 50);
  else if (controls.brake) speed = Math.max(speed - 0.35, 0);
  else speed = Math.max(speed - 0.04, 0);

  if (speed > 0.5) {
    if (controls.left) heading = (heading - 2.2 + 360) % 360;
    if (controls.right) heading = (heading + 2.2) % 360;

    // Kleine positie-update voor de demo. Dit is geen echte navigatie.
    const meters = speed * 0.00012;
    const radians = heading * Math.PI / 180;
    position.lat += Math.cos(radians) * meters;
    position.lng += Math.sin(radians) * meters /
      Math.max(0.2, Math.cos(position.lat * Math.PI / 180));

    if (map && marker) {
      const point = new google.maps.LatLng(position.lat, position.lng);
      marker.setPosition(point);
      marker.setIcon({
        path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW,
        scale: 5, fillColor: "#ef3d3d", fillOpacity: 1,
        strokeColor: "#fff", strokeWeight: 2, rotation: heading
      });
      map.panTo(point);
    }
  }

  document.getElementById("speed").textContent = Math.round(speed);
  statusText.textContent = speed > 0 ? "Rijden · alleen simulatie" : "Klaar om te rijden";
  document.getElementById("car").style.transform =
    `translate(-50%,-50%) rotate(${heading}deg)`;
  requestAnimationFrame(tick);
}
tick();
loadMap();
</script>
</body>
</html>
