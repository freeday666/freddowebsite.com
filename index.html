<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oranjestad RP — Vrachtwagen Game</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      background: #87ceeb;
      font-family: Arial, sans-serif;
    }
    #info {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 2;
      padding: 12px 16px;
      color: white;
      background: #18232bdd;
      border-radius: 8px;
      line-height: 1.5;
    }
    #info strong { color: #ff8a32; }
    #speed { font-weight: bold; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="info">
    <strong>ORANJESTAD RP</strong><br>
    Rijden: W/A/S/D of pijltjestoetsen<br>
    Snelheid: <span id="speed">0</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
