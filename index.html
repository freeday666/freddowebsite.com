
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oranjestad RP - Truck Simulator</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial;color:white}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:#101b25dd;border:1px solid #ffffff33;
border-radius:12px;padding:12px}
#brand{position:absolute;top:15px;left:15px;font-size:22px;font-weight:bold}
#info{position:absolute;top:65px;left:15px}
#speed{position:absolute;bottom:25px;right:25px;
font-size:30px;text-align:center;min-width:145px}
#map{position:absolute;top:15px;right:15px;width:180px;height:180px;
background:#182d37;border:2px solid white;border-radius:50%;overflow:hidden}
#map canvas{width:100%;height:100%}
#gps{position:absolute;top:210px;right:15px;width:180px;text-align:center}
#controls{position:absolute;bottom:20px;left:20px;font-size:13px}
#message{position:absolute;top:45%;width:100%;text-align:center;
font-size:26px;text-shadow:0 2px 5px black}
button{pointer-events:auto;border:0;border-radius:8px;padding:10px;
background:#e58a24;color:white;font-weight:bold;margin:3px}
#buttons{position:absolute;top:15px;left:50%;transform:translateX(-50%);
pointer-events:auto}
#mobile{position:absolute;bottom:15px;left:10px;right:10px;
display:none;justify-content:space-between;pointer-events:auto}
#mobile button{padding:18px;font-size:18px}
@media(max-width:700px){
 #mobile{display:flex}
 #controls{display:none}
 #map{width:120px;height:120px}
 #gps{top:145px;width:120px;font-size:12px}
 #speed{font-size:22px}
}
</style>
</head>
<body>
<div id="hud">
 <div id="brand">🚛 ORANJESTAD RP</div>
 <div id="info" class="panel">
   TRUCK SIMULATOR<br>
   <span id="gear">Versnelling: N</span><br>
   <span id="fuel">Brandstof: 100%</span><br>
   <span id="job">Opdracht: Vrij rijden</span>
 </div>
 <div id="buttons">
   <button onclick="toggleCamera()">CAMERA</button>
   <button onclick="resetTruck()">RESET</button>
   <button onclick="nextWaypoint()">GPS</button>
 </div>
 <div id="map"><canvas id="mapCanvas" width="180" height="180"></canvas></div>
 <div id="gps" class="panel">📍 GPS<br><span id="destination">Centrum</span><br>
 <span id="distance">0 m</span></div>
 <div id="speed" class="panel">
   <span id="speedValue">0</span><br>
   <small>KM/H</small>
 </div>
 <div id="controls" class="panel">
   W / ↑ = Gas<br>
   S / ↓ = Rem / achteruit<br>
   A / D = Sturen<br>
   SPACE = Handrem<br>
   C = Camera wisselen<br>
   R = Reset
 </div>
 <div id="mobile">
  <div>
   <button id="left">◀</button>
   <button id="right">▶</button>
  </div>
  <div>
   <button id="brake">REM</button>
   <button id="gas">GAS</button>
  </div>
 </div>
 <div id="message">ORANJESTAD RP<br><small>Truck Simulator</small></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene,camera,renderer,truck,clock;
let speed=0,steer=0,heading=0,fuel=100;
let cameraMode=0;
let keys={};
let handbrake=false;
let destinations=[
 {name:"Centrum",x:0,z:-100},
 {name:"Haven",x:130,z:80},
 {name:"Strand",x:-130,z:-120},
 {name:"Tankstation",x:100,z:-150},
 {name:"Industriegebied",x:-160,z:100}
];
let target=0;

scene=new THREE.Scene();
scene.background=new THREE.Color(0x83c9ed);
scene.fog=new THREE.Fog(0x83c9ed,180,650);

camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,1500);
renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
clock=new THREE.Clock();

scene.add(new THREE.HemisphereLight(0xcceeff,0x6a6248,2));
let sun=new THREE.DirectionalLight(0xffe1ae,2);
sun.position.set(100,180,80);
sun.castShadow=true;
scene.add(sun);

const mat=(color)=>new THREE.MeshStandardMaterial({color,roughness:.85});
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(1200,1200),
 mat(0xc3b48a)
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.15;
ground.receiveShadow=true;
scene.add(ground);

function box(parent,w,h,d,x,y,z,color){
 let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));
 o.position.set(x,y,z);
 o.castShadow=true;
 o.receiveShadow=true;
 parent.add(o);
 return o;
}

// Caribbean buildings
for(let x=-250;x<260;x+=48){
 for(let z=-250;z<260;z+=52){
  if(Math.abs(x)<32||Math.abs(z)<10)continue;
  let w=18+Math.random()*12;
  let h=9+Math.random()*20;
  let d=18+Math.random()*12;
  let colors=[0xffc17d,0xf4a6a0,0xffe1a1,0x8bc7bd,0xf3d5b5];
  let b=box(scene,w,h,d,x,h/2,z,colors[Math.floor(Math.random()*colors.length)]);
  box(b,w*.85,.8,d*.9,0,h*.2,0,0xf6e6ca);
 }
}

// Roads
function road(x,z,w,d){
 let r=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat(0x343a40));
 r.rotation.x=-Math.PI/2;
 r.position.set(x,.02,z);
 scene.add(r);
}
road(0,0,28,650);
road(0,0,650,28);
road(110,0,18,650);
road(-130,0,18,650);

// Road markings
for(let z=-300;z<300;z+=18)
 box(scene,.35,.06,8,0,.08,z,0xffffff);
for(let x=-300;x<300;x+=18)
 box(scene,8,.06,.35,x,.08,0,0xffffff);

// Palms
function palm(x,z){
 let trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.45,.7,9,9),
  mat(0x79502c)
 );
 trunk.position.set(x,4.5,z);
 trunk.rotation.z=(Math.random()-.5)*.15;
 scene.add(trunk);
 for(let i=0;i<8;i++){
  let leaf=new THREE.Mesh(
   new THREE.ConeGeometry(.55,7,5),
   mat(0x187b42)
  );
  let a=i*Math.PI/4;
  leaf.position.set(x+Math.cos(a)*2,8.5,z+Math.sin(a)*2);
  leaf.rotation.z=-Math.cos(a)*.8;
  leaf.rotation.x=Math.sin(a)*.8;
  scene.add(leaf);
 }
}
for(let i=0;i<110;i++){
 let x=(Math.random()-.5)*550;
 let z=(Math.random()-.5)*550;
 if(Math.abs(x)<23||Math.abs(z)<23)continue;
 palm(x,z);
}

// Sea
let sea=new THREE.Mesh(
 new THREE.PlaneGeometry(2000,2000),
 new THREE.MeshStandardMaterial({color:0x159ac0,roughness:.35})
);
sea.rotation.x=-Math.PI/2;
sea.position.set(850,-.3,0);
scene.add(sea);

// Truck
truck=new THREE.Group();
scene.add(truck);

let cab=new THREE.Group();
truck.add(cab);

// Chassis
box(cab,4.5,1,13,0,1.7,0,0x252a30);
// Trailer
box(cab,4.2,4.4,11,0,4.3,-9,0xe4e4df);
box(cab,4.3,.25,11,0,2,-9,0x333b40);

// Cab
box(cab,4.3,3.3,4.4,0,3.5,5,0xc83228);
box(cab,4.1,1.6,.15,0,4.1,7.22,0x91d2e5);
box(cab,4.2,1.5,.15,0,4.3,2.9,0x91d2e5);
box(cab,4.5,.35,4.5,0,5.2,5,0xa91e1e);

// Front bumper and grille
box(cab,4.5,.65,.5,0,1.9,7.4,0x555b60);
box(cab,1.8,1,.15,0,3,7.43,0x15191b);

// Headlights
box(cab,.75,.55,.2,-1.5,2.4,7.5,0xffffff);
box(cab,.75,.55,.2,1.5,2.4,7.5,0xffffff);

// Wheels
let wheels=[];
function wheel(x,z){
 let w=new THREE.Mesh(
  new THREE.CylinderGeometry(.85,.85,.65,24),
  mat(0x17191c)
 );
 w.rotation.z=Math.PI/2;
 w.position.set(x,.95,z);
 cab.add(w);
 wheels.push(w);
}
for(let z of [-12,-8,0,6]){
 wheel(-2.3,z);
 wheel(2.3,z);
}
wheel(-2.3,3);wheel(2.3,3);

// Mirrors
box(cab,.2,1,.2,-2.35,4,6,0x151515);
box(cab,.2,1,.2,2.35,4,6,0x151515);

truck.position.set(0,0,25);

// Destination markers
let markers=[];
destinations.forEach((p)=>{
 let g=new THREE.Group();
 let ring=new THREE.Mesh(
  new THREE.TorusGeometry(4,.4,8,32),
  new THREE.MeshBasicMaterial({color:0xffdb37})
 );
 ring.rotation.x=Math.PI/2;
 ring.position.y=.5;
 g.add(ring);
 let beam=new THREE.Mesh(
  new THREE.CylinderGeometry(.15,.15,8,8),
  new THREE.MeshBasicMaterial({color:0xffdf42})
 );
 beam.position.y=4;
 g.add(beam);
 g.position.set(p.x,0,p.z);
 scene.add(g);
 markers.push(g);
});
function updateGPS(){
 document.getElementById('destination').textContent=destinations[target].name;
}
function nextWaypoint(){
 target=(target+1)%destinations.length;
 updateGPS();
}
updateGPS();

// Keyboard
window.addEventListener('keydown',e=>{
 keys[e.code]=true;
 if(e.code==='KeyC')toggleCamera();
 if(e.code==='KeyR')resetTruck();
 if(e.code==='Space')handbrake=true;
});
window.addEventListener('keyup',e=>{
 keys[e.code]=false;
 if(e.code==='Space')handbrake=false;
});

function bind(id,key){
 let el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true});
 el.addEventListener('pointerup',()=>keys[key]=false);
 el.addEventListener('pointerleave',()=>keys[key]=false);
 el.addEventListener('pointercancel',()=>keys[key]=false);
}
bind('gas','KeyW');
bind('brake','KeyS');
bind('left','KeyA');
bind('right','KeyD');

function toggleCamera(){
 cameraMode=(cameraMode+1)%2;
}
function resetTruck(){
 truck.position.set(0,0,25);
 truck.rotation.y=0;
 heading=0;speed=0;
}

function update(dt){
 let throttle=keys.KeyW||keys.ArrowUp;
 let brake=keys.KeyS||keys.ArrowDown;
 let left=keys.KeyA||keys.ArrowLeft;
 let right=keys.KeyD||keys.ArrowRight;

 if(throttle){
  speed+=17*dt;
 }else{
  speed*=Math.pow(.988,dt*60);
 }
 if(brake){
  if(speed>0)speed-=35*dt;
  else speed-=10*dt;
 }
 if(handbrake)speed*=Math.pow(.93,dt*60);

 speed=THREE.MathUtils.clamp(speed,-12,42);

 let steering=(right?1:0)-(left?1:0);
 steer=THREE.MathUtils.damp(steer,steering,5,dt);

 if(Math.abs(speed)>.3){
  heading-=steer*speed*.006*dt*60;
 }
 truck.rotation.y=heading;
 truck.position.x+=Math.sin(heading)*speed*dt;
 truck.position.z+=Math.cos(heading)*speed*dt;

 wheels.forEach(w=>w.rotation.x+=speed*dt);
 fuel=Math.max(0,fuel-Math.abs(speed)*dt*.0007);

 document.getElementById('speedValue').textContent=Math.abs(Math.round(speed*3.6));
 document.getElementById('fuel').textContent='Brandstof: '+Math.round(fuel)+'%';
 document.getElementById('gear').textContent='Versnelling: '+(speed<-.5?'R':speed>.5?'D':'N');

 let p=destinations[target];
 let distance=Math.hypot(p.x-truck.position.x,p.z-truck.position.z);
 document.getElementById('distance').textContent=Math.round(distance)+' m';
 if(distance<9){
  document.getElementById('job').textContent='Opdracht: Bestemming bereikt!';
 }else{
  document.getElementById('job').textContent='Opdracht: Vrij rijden';
 }

 markers.forEach((m,i)=>{
  m.visible=i===target;
  m.rotation.y+=dt*.5;
 });

 let desired,look;
 if(cameraMode===0){
  // Cockpit perspective
  desired=new THREE.Vector3(0,4.2,7.0);
  look=new THREE.Vector3(0,3.6,40);
 }else{
  desired=new THREE.Vector3(0,10,-24);
  look=new THREE.Vector3(0,2,12);
 }
 desired.applyAxisAngle(new THREE.Vector3(0,1,0),heading);
 desired.add(truck.position);
 look.applyAxisAngle(new THREE.Vector3(0,1,0),heading);
 look.add(truck.position);
 camera.position.lerp(desired,.1);
 camera.lookAt(look);

 // minimap
 let c=document.getElementById('mapCanvas');
 let ctx=c.getContext('2d');
 ctx.clearRect(0,0,180,180);
 ctx.fillStyle='#284e48';
 ctx.fillRect(0,0,180,180);
 ctx.strokeStyle='#a5a5a5';
 ctx.lineWidth=8;
 ctx.beginPath();ctx.moveTo(90,0);ctx.lineTo(90,180);ctx.stroke();
 ctx.beginPath();ctx.moveTo(0,90);ctx.lineTo(180,90);ctx.stroke();
 ctx.fillStyle='#ffd32c';
 ctx.beginPath();
 ctx.arc(90+(p.x-truck.position.x)*.3,90+(p.z-truck.position.z)*.3,5,0,Math.PI*2);
 ctx.fill();
 ctx.fillStyle='#ff4b39';
 ctx.beginPath();ctx.arc(90,90,5,0,Math.PI*2);ctx.fill();
}
function animate(){
 requestAnimationFrame(animate);
 let dt=Math.min(clock.getDelta(),.05);
 update(dt);
 renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
