<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Freddo Porto</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px 16px;
      display: grid; place-items: center;
      background: #111827; color: #f9fafb;
      font: 16px system-ui, sans-serif;
    }
    main { width: min(100%, 440px); }
    h1 { margin: 0 0 6px; }
    .muted { color: #9ca3af; }
    .card {
      margin-top: 16px; padding: 18px; border-radius: 16px;
      background: #1f2937; border: 1px solid #374151;
    }
    label { display: block; margin: 12px 0 6px; }
    input, button {
      width: 100%; border: 0; border-radius: 10px;
      padding: 12px; font: inherit;
    }
    input { background: #111827; color: white; border: 1px solid #4b5563; }
    button { cursor: pointer; color: white; background: #2563eb; margin-top: 10px; }
    button.secondary { background: #374151; }
    button.danger { background: #b91c1c; }
    audio { width: 100%; margin-top: 12px; }
    a { display: inline-block; margin-top: 10px; color: #93c5fd; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    #status { min-height: 24px; margin-top: 10px; color: #a7f3d0; }
    #lockScreen {
      position: fixed; inset: 0; background: #111827;
      display: none; place-items: center; padding: 20px; z-index: 2;
    }
    #lockScreen article { width: min(100%, 360px); }
  </style>
</head>
<body>
  <main>
    <h1>📻 Freddo Porto</h1>
    <div class="muted">Webapp · <span id="clock"></span></div>

    <section class="card">
      <h2>Contact</h2>
      <label for="phone">Telefoonnummer</label>
      <input id="phone" type="tel" autocomplete="tel" placeholder="+31612345678">
      <div class="row">
        <button id="callBtn">📞 Bellen</button>
        <button id="smsBtn" class="secondary">✉️ Sms</button>
      </div>
      <p class="muted">Je telefoon opent de bel- of berichtenapp.</p>
    </section>

    <section class="card">
      <h2>Spraakbericht opnemen</h2>
      <button id="recordBtn">🎙️ Start opname</button>
      <audio id="player" controls hidden></audio>
      <a id="download" hidden>Download opname</a>
      <div id="status" role="status" aria-live="polite"></div>
    </section>

    <section class="card">
      <h2>App-vergrendeling</h2>
      <label for="pin">Nieuwe pincode (4–8 cijfers)</label>
      <input id="pin" type="password" inputmode="numeric" maxlength="8">
      <button id="savePinBtn" class="secondary">Pincode opslaan</button>
      <button id="lockBtn" class="danger">Vergrendel app</button>
      <p class="muted">Dit is een eenvoudige vergrendeling voor deze webpagina.</p>
    </section>
  </main>

  <div id="lockScreen" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
    <article>
      <h2 id="lockTitle">App vergrendeld</h2>
      <label for="unlockPin">Voer je pincode in</label>
      <input id="unlockPin" type="password" inputmode="numeric" maxlength="8">
      <button id="unlockBtn">Ontgrendelen</button>
      <p id="lockError" class="muted" aria-live="polite"></p>
    </article>
  </div>

  <script src="script.js" defer></script>
</body>
</html>q
