<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Truckrijdemo</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: white;
      background: #101418;
      font-family: system-ui, sans-serif;
    }

    .game {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 420px;
      overflow: hidden;
      background: #8fc5e5;
    }

    /* Cabinefoto als volledig beeld */
    .scene {
      position: absolute;
      inset: 0;
      background-image: url("cabine.jpg");
      background-size: cover;
      background-position: center;
      transform: scale(1.03);
    }

    /* Subtiele bewegingsillusie op de weg */
    .motion {
      position: absolute;
      inset: 42% 15% 12%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0 45px,
        rgba(255,255,255,.55) 46px 49px,
        transparent 50px 105px
      );
      clip-path: polygon(45% 0, 55% 0, 100% 100%, 0 100%);
      animation: roadMove .45s linear infinite;
    }

    .game.driving .motion { opacity: .45; }

    @keyframes roadMove {
      from { background-position-y: 0; }
      to   { background-position-y: 105px; }
    }

    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      background: rgba(10, 15, 19, .78);
      box-shadow: 0 2px 12px #0005;
      line-height: 1.7;
    }

    .hud strong { color: #ffcf69; }

    .help {
      position: absolute;
      top: 16px;
      right: 16px;
      max-width: 280px;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(10, 15, 19, .78);
      font-size: 14px;
    }

    .controls {
      position: absolute;
      bottom: 18px;
      left: 50%;
      display: flex;
      gap: 10px;
      transform: translateX(-50%);
    }

    button {
      min-width: 70px;
      padding: 12px 17px;
      border: 1px solid #ffffff66;
      border-radius: 8px;
      color: white;
      background: #17212bcc;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      touch-action: none;
    }

    button:active,
    button.on {
      background: #d66b22;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(0, 0, 0, .42);
    }

    .card {
      width: min(420px, 100%);
      padding: 24px;
      border: 1px solid #ffffff33;
      border-radius: 14px;
      background: rgba(18, 24, 29, .94);
      text-align: center;
    }

    .card h1 { margin-top: 0; }

    @media (max-width: 600px) {
      .help {
        top: auto;
        right: 10px;
        bottom: 85px;
        max-width: 200px;
        font-size: 12px;
      }

      .hud { top: 10px; left: 10px; font-size: 14px; }
      .controls { bottom: 12px; gap: 5px; }
      button { min-width: 58px; padding: 11px 12px; }
    }
  </style>
</head>

<body>
  <main class="game" id="game">
    <div class="scene"></div>
    <div class="motion"></div>

    <section class="hud">
      Snelheid: <strong><span id="speed">0</span> km/u</strong><br>
      Afstand: <strong><span id="distance">0.0</span> km</strong><br>
      Versnelling: <strong id="gear">N</strong>
    </section>

    <section class="help">
      <strong>Bediening</strong><br>
      W / ↑ = gas · S / ↓ = rem<br>
      A / ← = links · D / → = rechts
    </section>

    <div class="controls">
      <button data-key="ArrowLeft">◀</button>
      <button data-key="ArrowDown">Rem</button>
      <button data-key="ArrowUp">Gas</button>
      <button data-key="ArrowRight">▶</button>
    </div>

    <div class="overlay" id="overlay">
      <div class="card">
        <h1>Truckrijdemo</h1>
        <p>Gebruik je toetsenbord of de knoppen om te rijden.</p>
        <p>Voor de cabineweergave: zet je afbeelding als <code>cabine.jpg</code> naast dit bestand.</p>
        <button id="start">Start rijden</button>
      </div>
    </div>
  </main>

  <script>
    const game = document.querySelector("#game");
    const overlay = document.querySelector("#overlay");
    const speedOutput = document.querySelector("#speed");
    const distanceOutput = document.querySelector("#distance");
    const gearOutput = document.querySelector("#gear");

    const held = new Set();
    let started = false;
    let speed = 0;
    let distance = 0;
    let steering = 0;
    let lastTime = performance.now();

    document.querySelector("#start").addEventListener("click", () => {
      started = true;
      overlay.style.display = "none";
    });

    addEventListener("keydown", event => {
      const key = event.key.toLowerCase();
      if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)) {
        event.preventDefault();
      }
      held.add(key);
    });

    addEventListener("keyup", event => held.delete(event.key.toLowerCase()));
    addEventListener("blur", () => held.clear());

    document.querySelectorAll("[data-key]").forEach(button => {
      const key = button.dataset.key.toLowerCase();

      button.addEventListener("pointerdown", event => {
        event.preventDefault();
        held.add(key);
        button.classList.add("on");
        button.setPointerCapture(event.pointerId);
      });

      const release = () => {
        held.delete(key);
        button.classList.remove("on");
      };

      button.addEventListener("pointerup", release);
      button.addEventListener("pointercancel", release);
      button.addEventListener("lostpointercapture", release);
    });

    function has(...keys) {
      return keys.some(key => held.has(key));
    }

    function animate(now) {
      requestAnimationFrame(animate);

      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (started) {
        if (has("w", "arrowup")) speed += 11 * dt;
        else speed -= 2.5 * dt;

        if (has("s", "arrowdown")) speed -= 24 * dt;
        speed = Math.max(0, Math.min(speed, 130));

        const direction =
          (has("d", "arrowright") ? 1 : 0) -
          (has("a", "arrowleft") ? 1 : 0);

        steering += (direction - steering) * Math.min(1, dt * 5);

        distance += speed * dt / 3600;

        game.classList.toggle("driving", speed > 8);

        // Kleine cabinebeweging bij sturen, alleen als visueel effect.
        document.querySelector(".scene").style.backgroundPosition =
          `calc(50% + ${steering * -8}px) center`;
      }

      speedOutput.textContent = Math.round(speed);
      distanceOutput.textContent = distance.toFixed(1);
      gearOutput.textContent = speed < 1 ? "N" : String(Math.min(12, Math.ceil(speed / 10)));
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
