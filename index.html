<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Mobiele stadsrit</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      background: #263238;
      font-family: Arial, sans-serif;
      touch-action: none;
    }
    canvas { display: block; width: 100vw; height: 100vh; }
    .controls {
      position: fixed;
      inset: auto 0 20px;
      display: flex;
      justify-content: space-between;
      padding: 0 22px;
      pointer-events: none;
    }
    .group { display: flex; gap: 14px; }
    button {
      width: 68px;
      height: 68px;
      border: 2px solid #fff9;
      border-radius: 50%;
      background: #111b;
      color: white;
      font-size: 27px;
      font-weight: bold;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
    }
    button:active { background: #398aeecc; }
    #status {
      position: fixed;
      top: 14px;
      left: 14px;
      padding: 9px 12px;
      border-radius: 10px;
      background: #111b;
      color: white;
      font-size: 15px;
    }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<div id="status">🚗 Stadsrit</div>
<div class="controls">
  <div class="group">
    <button data-key="left" aria-label="Links">◀</button>
    <button data-key="right" aria-label="Rechts">▶</button>
  </div>
  <div class="group">
    <button data-key="brake" aria-label="Rem">▼</button>
    <button data-key="gas" aria-label="Gas">▲</button>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W, H, dpr;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", resize);
resize();

const keys = { left:false, right:false, gas:false, brake:false };
document.querySelectorAll("button").forEach(btn => {
  const key = btn.dataset.key;
  const on = e => { e.preventDefault(); keys[key] = true; };
  const off = e => { e.preventDefault(); keys[key] = false; };
  btn.addEventListener("pointerdown", on);
  btn.addEventListener("pointerup", off);
  btn.addEventListener("pointercancel", off);
  btn.addEventListener("pointerleave", off);
});

const car = { x:0, y:0, angle:0, speed:0 };
const road = 112;
let distance = 0;

function draw() {
  const scale = Math.max(0.7, Math.min(W, H) / 650);
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(scale, scale);
  ctx.rotate(-car.angle);
  ctx.translate(-car.x, -car.y);

  // Gras
  ctx.fillStyle = "#568b4e";
  ctx.fillRect(car.x-W, car.y-H, 2*W, 2*H);

  // Stadsblokken
  const grid = 270;
  const startX = Math.floor((car.x-W)/grid)*grid;
  const startY = Math.floor((car.y-H)/grid)*grid;
  for (let x=startX; x<car.x+W; x+=grid) {
    for (let y=startY; y<car.y+H; y+=grid) {
      ctx.fillStyle = "#73816d";
      ctx.fillRect(x+road/2+8, y+road/2+8, grid-road-16, grid-road-16);
      ctx.fillStyle = "#9b927e";
      ctx.fillRect(x+road/2+22, y+road/2+22, grid-road-44, grid-road-44);
      // Kleine daken/huizen
      ctx.fillStyle = "#c9b995";
      ctx.fillRect(x+road/2+42, y+road/2+42, 54, 42);
      ctx.fillStyle = "#5d7f91";
      ctx.fillRect(x+road/2+118, y+road/2+58, 48, 54);
      ctx.fillStyle = "#78965d";
      ctx.beginPath();
      ctx.arc(x+road/2+190, y+road/2+190, 13, 0, Math.PI*2);
      ctx.fill();
    }
  }

  // Straten
  ctx.fillStyle = "#42474a";
  for (let x=startX; x<car.x+W; x+=grid) ctx.fillRect(x-road/2, car.y-H, road, 2*H);
  for (let y=startY; y<car.y+H; y+=grid) ctx.fillRect(car.x-W, y-road/2, 2*W, road);

  // Wegmarkeringen
  ctx.strokeStyle = "#e8d994";
  ctx.lineWidth = 3;
  ctx.setLineDash([18, 17]);
  for (let x=startX; x<car.x+W; x+=grid) {
    ctx.beginPath(); ctx.moveTo(x, car.y-H); ctx.lineTo(x, car.y+H); ctx.stroke();
  }
  for (let y=startY; y<car.y+H; y+=grid) {
    ctx.beginPath(); ctx.moveTo(car.x-W, y); ctx.lineTo(car.x+W, y); ctx.stroke();
  }
  ctx.setLineDash([]);

  // Auto
  ctx.save();
  ctx.translate(car.x, car.y);
  ctx.fillStyle = "#111";
  ctx.fillRect(-18, -12, 9, 8); ctx.fillRect(9, -12, 9, 8);
  ctx.fillRect(-18, 5, 9, 8); ctx.fillRect(9, 5, 9, 8);
  ctx.fillStyle = "#e53935";
  ctx.fillRect(-22, -10, 44, 20);
  ctx.fillStyle = "#bde6f2";
  ctx.fillRect(-10, -8, 19, 16);
  ctx.fillStyle = "#fff4b0";
  ctx.fillRect(17, -8, 5, 5); ctx.fillRect(17, 3, 5, 5);
  ctx.restore();

  ctx.restore();

  // HUD
  document.getElementById("status").textContent =
    `🚗 Snelheid: ${Math.round(Math.abs(car.speed)*18)} km/u`;
}

function update() {
  if (keys.gas) car.speed = Math.min(car.speed + 0.12, 7);
  else if (keys.brake) car.speed = Math.max(car.speed - 0.16, -3);
  else car.speed *= 0.985;

  if (keys.left) car.angle -= 0.045 * (car.speed < 0 ? -1 : 1);
  if (keys.right) car.angle += 0.045 * (car.speed < 0 ? -1 : 1);

  car.x += Math.sin(car.angle) * car.speed;
  car.y -= Math.cos(car.angle) * car.speed;
  distance += Math.abs(car.speed);

  draw();
  requestAnimationFrame(update);
}
update();
</script>
</body>
</html>
