
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Oranjestad Roleplay 3D</title>

<style>
* { box-sizing:border-box; }

body {
  margin:0;
  overflow:hidden;
  font-family:Arial;
  background:#75c9ed;
  touch-action:none;
}

canvas { display:block; }

#hud {
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  color:white;
  font-weight:bold;
  text-shadow:1px 2px 4px black;
  display:flex;
  justify-content:space-between;
  z-index:5;
}

button {
  border:0;
  border-radius:12px;
  padding:14px;
  background:#ffbd45;
  font-weight:bold;
}

#joystick {
  position:absolute;
  bottom:25px;
  left:25px;
  width:120px;
  height:120px;
  border-radius:50%;
  background:#ffffff66;
  border:3px solid white;
  z-index:5;
}

#stick {
  position:absolute;
  width:48px;
  height:48px;
  left:33px;
  top:33px;
  border-radius:50%;
  background:white;
}

#buttons {
  position:absolute;
  right:20px;
  bottom:30px;
  display:flex;
  flex-direction:column;
  gap:12px;
  z-index:5;
}

#loading {
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  background:#75c9ed;
  font-size:22px;
  font-weight:bold;
  z-index:10;
}
</style>
</head>

<body>

<div id="loading">Oranjestad laden...</div>

<div id="hud">
  <span>🇦🇼 ORANJESTAD RP</span>
  <span>SINGLE PLAYER</span>
</div>

<div id="joystick">
  <div id="stick"></div>
</div>

<div id="buttons">
  <button onclick="enterCar()">🚘 Auto</button>
  <button onclick="exitCar()">🚶 Uitstappen</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x75c9ed);
scene.fog = new THREE.Fog(0x75c9ed, 40, 140);

const camera = new THREE.PerspectiveCamera(
  65, innerWidth/innerHeight, 0.1, 300
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x887755,2));

const sun = new THREE.DirectionalLight(0xffffff,2);
sun.position.set(30,50,20);
scene.add(sun);

function box(x,y,z,w,h,d,color) {
  const obj = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({color})
  );
  obj.position.set(x,y,z);
  scene.add(obj);
  return obj;
}

// Aruba grond
box(0,-0.2,0,220,0.2,220,0xd8bd8b);

// Wegen
box(0,0,0,10,0.08,190,0x444444);
box(0,0,0,190,0.08,10,0x444444);

// Wegmarkeringen
for(let i=-85;i<90;i+=12) {
  box(0,0.06,i,0.2,0.02,5,0xffffff);
  box(i,0.06,0,5,0.02,0.2,0xffffff);
}

// Kleurrijke huizen
const colors=[
  0xffd166,0xff8c69,0xf4f1de,
  0x9ad1d4,0xf7c6c7,0xe9c46a
];

for(let i=0;i<65;i++) {
  const x=(Math.random()-0.5)*140;
  const z=(Math.random()-0.5)*140;

  if(Math.abs(x)<10 || Math.abs(z)<10) continue;

  const w=5+Math.random()*5;
  const h=4+Math.random()*7;
  const d=5+Math.random()*5;

  box(x,h/2,z,w,h,d,colors[i%colors.length]);
  box(x,h+0.1,z,w+0.3,0.2,d+0.3,0xffffff);
  box(x,1,z+d/2,1.2,2,0.15,0x754c24);
}

// Zee en strand
box(0,-0.1,-105,220,0.1,35,0x20b5dc);
box(0,-0.05,-84,220,0.1,10,0xf2d79b);

// Palmbomen
function palm(x,z) {
  const trunk=new THREE.Mesh(
    new THREE.CylinderGeometry(0.2,0.3,4,8),
    new THREE.MeshStandardMaterial({color:0x87542b})
  );
  trunk.position.set(x,2,z);
  scene.add(trunk);

  for(let i=0;i<7;i++) {
    const leaf=new THREE.Mesh(
      new THREE.ConeGeometry(0.5,4,5),
      new THREE.MeshStandardMaterial({color:0x228b45})
    );
    leaf.position.set(x,4.2,z);
    leaf.rotation.z=Math.PI/2;
    leaf.rotation.y=i*Math.PI*2/7;
    scene.add(leaf);
  }
}

for(let i=0;i<20;i++) {
  palm(-20+i*2,13);
  palm(20-i*2,-13);
}

// Personage
const player=new THREE.Group();

const body=new THREE.Mesh(
  new THREE.BoxGeometry(0.8,1.2,0.5),
  new THREE.MeshStandardMaterial({color:0x2266cc})
);
body.position.y=1.1;
player.add(body);

const head=new THREE.Mesh(
  new THREE.SphereGeometry(0.35,12,12),
  new THREE.MeshStandardMaterial({color:0xe5b18c})
);
head.position.y=2;
player.add(head);

scene.add(player);

// Auto
const car=new THREE.Group();

const carBody=new THREE.Mesh(
  new THREE.BoxGeometry(2.2,0.8,4),
  new THREE.MeshStandardMaterial({color:0xffffff})
);
carBody.position.y=0.8;
car.add(carBody);

const cabin=new THREE.Mesh(
  new THREE.BoxGeometry(1.7,0.8,1.9),
  new THREE.MeshStandardMaterial({color:0x55b9e0})
);
cabin.position.set(0,1.5,-0.2);
car.add(cabin);

for(const x of [-1,1]) {
  for(const z of [-1.3,1.3]) {
    const wheel=new THREE.Mesh(
      new THREE.CylinderGeometry(0.4,0.4,0.25,12),
      new THREE.MeshStandardMaterial({color:0x222222})
    );
    wheel.rotation.z=Math.PI/2;
    wheel.position.set(x,0.4,z);
    car.add(wheel);
  }
}

scene.add(car);
car.position.set(4,0,4);

// Bediening
let mx=0,mz=0;
let driving=false;
let rotation=0;

const joy=document.getElementById("joystick");
const stick=document.getElementById("stick");

function joystickMove(e) {
  const r=joy.getBoundingClientRect();

  let dx=e.clientX-(r.left+r.width/2);
  let dy=e.clientY-(r.top+r.height/2);

  const max=35;
  const len=Math.hypot(dx,dy);

  if(len>max) {
    dx*=max/len;
    dy*=max/len;
  }

  mx=dx/max;
  mz=dy/max;

  stick.style.transform=`translate(${dx}px,${dy}px)`;
}

function resetJoystick() {
  mx=0;
  mz=0;
  stick.style.transform="translate(0,0)";
}

joy.addEventListener("pointerdown",e=>{
  joy.setPointerCapture(e.pointerId);
  joystickMove(e);
});

joy.addEventListener("pointermove",e=>{
  if(e.buttons) joystickMove(e);
});

joy.addEventListener("pointerup",resetJoystick);
joy.addEventListener("pointercancel",resetJoystick);

const keys={};

window.addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
});

window.addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
});

function enterCar() {
  driving=true;
}

function exitCar() {
  driving=false;
  player.position.copy(car.position);
}

// Game loop
function animate() {
  requestAnimationFrame(animate);

  let x=mx;
  let z=mz;

  if(keys.w || keys.arrowup) z-=1;
  if(keys.s || keys.arrowdown) z+=1;
  if(keys.a || keys.arrowleft) x-=1;
  if(keys.d || keys.arrowright) x+=1;

  const len=Math.hypot(x,z);

  if(len>1) {
    x/=len;
    z/=len;
  }

  const target=driving?car:player;
  const speed=driving?0.22:0.09;

  if(Math.abs(x)+Math.abs(z)>0.01) {
    rotation=Math.atan2(x,z);
    target.position.x+=x*speed;
    target.position.z+=z*speed;
    target.rotation.y=rotation;

    if(!driving) {
      car.position.set(
        player.position.x+3,
        0,
        player.position.z+2
      );
    }
  }

  if(driving) {
    player.position.copy(car.position);
  }

  const focus=driving?car.position:player.position;

  camera.position.lerp(
    new THREE.Vector3(
      focus.x,
      focus.y+8,
      focus.z+12
    ),0.09
  );

  camera.lookAt(focus.x,focus.y+1,focus.z);

  renderer.render(scene,camera);
}

document.getElementById("loading").style.display="none";

camera.position.set(0,8,12);
animate();

window.addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
