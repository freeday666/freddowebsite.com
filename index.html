<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Oranjestad RP</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1020; font-family: Arial, sans-serif; color: #fff; }
  #map { position: absolute; inset: 0; }
  #panel {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: rgba(0,0,0,0.7); padding: 12px 14px; border-radius: 10px; width: 280px; max-width: calc(100% - 24px);
  }
  #panel h1 { font-size: 18px; margin-bottom: 8px; }
  #panel input {
    width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #555; background: #111; color: #fff; font-size: 14px; margin-bottom: 8px;
  }
  #panel button {
    width: 100%; padding: 9px; border: none; border-radius: 6px; background: #1e88e5; color: #fff; font-size: 14px; cursor: pointer;
  }
  #panel button:active { background: #1565c0; }
  #status { font-size: 12px; margin-top: 8px; color: #ccc; }
  #gate {
    position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: rgba(11,16,32,0.95); padding: 20px;
  }
  #gate div { max-width: 420px; text-align: center; line-height: 1.5; }
  #gate code { background: #222; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>

<div id="map"></div>

<div id="panel">
  <h1>Oranjestad RP</h1>
  <input id="apiKey" type="text" placeholder="Plak hier je Google Maps API-key">
  <button id="loadBtn">Kaart laden</button>
  <div id="status">Voer je eigen API-key in om de kaart te tonen.</div>
</div>

<div id="gate" style="display:none"></div>

<script>
  // Oranjestad, Aruba
  const ORANJESTAD = { lat: 12.5186, lng: -70.0358 };
  const STORAGE_KEY = 'oranjestad_gmaps_key';

  const statusEl = document.getElementById('status');
  const input = document.getElementById('apiKey');
  const btn = document.getElementById('loadBtn');

  // Onthoud je key lokaal in je browser (niet op een server)
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) input.value = saved;

  btn.addEventListener('click', () => {
    const key = input.value.trim();
    if (!key) {
      statusEl.textContent = 'Vul eerst een API-key in.';
      return;
    }
    localStorage.setItem(STORAGE_KEY, key);
    loadGoogleMaps(key);
  });

  function loadGoogleMaps(key) {
    statusEl.textContent = 'Kaart laden...';
    // Verwijder eventueel een vorig script
    const old = document.getElementById('gmaps-script');
    if (old) old.remove();

    window.initMap = function () {
      const map = new google.maps.Map(document.getElementById('map'), {
        center: ORANJESTAD,
        zoom: 15,
        mapTypeId: 'roadmap',
        tilt: 45,
        disableDefaultUI: false,
      });
      new google.maps.Marker({ position: ORANJESTAD, map, title: 'Oranjestad' });
      statusEl.textContent = 'Kaart geladen. Oranjestad, Aruba.';
    };

    const s = document.createElement('script');
    s.id = 'gmaps-script';
    s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) + '&callback=initMap&loading=async';
    s.async = true;
    s.onerror = () => { statusEl.textContent = 'Kon kaart niet laden. Controleer je API-key.'; };
    document.head.appendChild(s);
  }

  // Auto-laden als er al een key is opgeslagen
  if (saved) loadGoogleMaps(saved);
</script>
</body>
</html>
