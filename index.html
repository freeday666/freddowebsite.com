<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SWAT — Breach Training</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111820;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
.top{position:fixed;inset:12px 12px auto;display:flex;justify-content:space-between;color:#fff;text-shadow:0 2px 4px #000;pointer-events:none}
.badge{background:#111c;border:1px solid #ffffff55;border-radius:9px;padding:8px 11px;font-size:12px}
.controls{position:fixed;inset:0;pointer-events:none}
button{pointer-events:auto;color:white;background:#16212dcc;border:2px solid #ffffff66;border-radius:50%;font-weight:bold;font-size:13px;touch-action:none;user-select:none;-webkit-user-select:none}
button:active,.on{background:#347b70dd}
#move{position:absolute;left:20px;bottom:25px;width:132px;height:132px}
#fire{position:absolute;right:22px;bottom:32px;width:76px;height:76px;background:#8d302ddd}
#reload{position:absolute;right:110px;bottom:42px;width:60px;height:60px}
#aim{position:absolute;right:25px;bottom:122px;width:58px;height:58px}
#message{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;background:#101820ee;padding:18px 22px;border:1px solid #fff6;border-radius:12px;text-align:center;display:none}
.cross{position:fixed;left:50%;top:50%;width:24px;height:24px;transform:translate(-50%,-50%);pointer-events:none}
.cross:before,.cross:after{content:"";position:absolute;background:#d8e6df;box-shadow:0 0 3px #000}
.cross:before{width:2px;height:24px;left:11px}
.cross:after{height:2px;width:24px;top:11px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="top">
  <div class="badge">SWAT · BREACH TRAINING<br><span id="objective">DOEL: beveilig de ruimte</span></div>
  <div class="badge"><span id="health">❤ 100</span><br><span id="ammo">AMMO 12 / 48</span></div>
</div>
<div class="cross"></div>
<div class="controls">
  <button id="move">INZETTEN<br>HOUD VAST</button>
  <button id="aim">RICHTEN</button>
  <button id="reload">HERLADEN</button>
  <button id="fire">VUUR</button>
</div>
<div id="message"></div>

<script>
(()=>{
"use strict";
const canvas=document.querySelector("#game");
const ctx=canvas.getContext("2d");
const ammoEl=document.querySelector("#ammo");
const healthEl=document.querySelector("#health");
const objective=document.querySelector("#objective");
const message=document.querySelector("#message");

let W=innerWidth,H=innerHeight,D=1;
let moving=false,aiming=false,ammo=12,reserve=48,health=100,score=0;
let aimX=0,recoil=0,flash=0,gameOver=false,last=performance.now(),time=0;
const enemies=[
  {x:-1.3,z:7,hp:2,alive:true,phase:0},
  {x:1.6,z:10,hp:2,alive:true,phase:2},
  {x:.1,z:14,hp:2,alive:true,phase:4}
];

function resize(){
  D=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  canvas.width=W*D;canvas.height=H*D;
  ctx.setTransform(D,0,0,D,0,0);
}
addEventListener("resize",resize);resize();

function bindHold(id,setter){
  const button=document.getElementById(id);
  button.addEventListener("pointerdown",e=>{
    e.preventDefault();
    button.setPointerCapture(e.pointerId);
    setter(true);
    button.classList.add("on");
  });
  const release=e=>{
    e.preventDefault();
    setter(false);
    button.classList.remove("on");
  };
  button.addEventListener("pointerup",release);
  button.addEventListener("pointercancel",release);
}
bindHold("move",v=>moving=v);
bindHold("aim",v=>aiming=v);

let dragging=false,lastX=0;
canvas.addEventListener("pointerdown",e=>{
  if(e.clientX>W*.38){dragging=true;lastX=e.clientX;canvas.setPointerCapture(e.pointerId)}
});
canvas.addEventListener("pointermove",e=>{
  if(dragging){aimX+=(e.clientX-lastX)*.006;lastX=e.clientX}
});
canvas.addEventListener("pointerup",()=>dragging=false);
canvas.addEventListener("pointercancel",()=>dragging=false);

document.querySelector("#fire").addEventListener("pointerdown",e=>{
  e.preventDefault();shoot();
});
document.querySelector("#reload").addEventListener("click",reload);

function updateHUD(){
  ammoEl.textContent=`AMMO ${ammo} / ${reserve}`;
  healthEl.textContent=`❤ ${health}`;
  objective.textContent=score>=enemies.length
    ?"DOEL: ruimte beveiligd"
    :`DOEL: beveilig de ruimte · ${score}/${enemies.length}`;
}
function reload(){
  if(ammo<12&&reserve>0&&!gameOver){
    const amount=Math.min(12-ammo,reserve);
    ammo+=amount;reserve-=amount;updateHUD();
  }
}
function shoot(){
  if(gameOver)return;
  if(ammo<=0){reload();return}
  ammo--;flash=1;recoil=1;updateHUD();

  const targets=enemies.filter(e=>e.alive);
  if(!targets.length)return;
  targets.sort((a,b)=>Math.abs(a.x-aimX)-Math.abs(b.x-aimX));
  const target=targets[0];
  if(Math.abs(target.x-aimX)<.72){
    target.hp--;
    if(target.hp<=0){target.alive=false;score++;updateHUD()}
  }
}

function rect(x,y,w,h,color){
  ctx.fillStyle=color;ctx.fillRect(x,y,w,h);
}
function polygon(points,color){
  ctx.fillStyle=color;ctx.beginPath();
  points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  ctx.closePath();ctx.fill();
}
function drawEnemy(e){
  const scale=H/(e.z*2.4);
  const x=W/2+(e.x-aimX*.65)*scale;
  const y=H*.48+scale*.42+Math.sin(time*.002+e.phase)*3;
  const bodyW=scale*.42,bodyH=scale*.76;
  if(x<-bodyW||x>W+bodyW)return;

  // Schaduw en laarzen
  ctx.fillStyle="#0007";
  ctx.beginPath();ctx.ellipse(x,y+bodyH*.53,bodyW*.75,scale*.08,0,0,Math.PI*2);ctx.fill();
  rect(x-bodyW*.35,y+bodyH*.31,bodyW*.25,bodyH*.22,"#252a2b");
  rect(x+bodyW*.1,y+bodyH*.31,bodyW*.25,bodyH*.22,"#252a2b");

  // Uniform en armen
  rect(x-bodyW*.43,y-bodyH*.03,bodyW*.86,bodyH*.42,"#333d3c");
  rect(x-bodyW*.67,y+bodyH*.02,bodyW*.22,bodyH*.33,"#39413e");
  rect(x+bodyW*.45,y+bodyH*.02,bodyW*.22,bodyH*.33,"#39413e");

  // Vest
  rect(x-bodyW*.3,y+bodyH*.02,bodyW*.6,bodyH*.28,"#1d2728");
  rect(x-bodyW*.18,y+bodyH*.08,bodyW*.14,bodyH*.1,"#65705f");
  rect(x+bodyW*.04,y+bodyH*.08,bodyW*.14,bodyH*.1,"#65705f");

  // Hoofd en helm
  ctx.fillStyle="#ae896b";
  ctx.beginPath();ctx.arc(x,y-bodyH*.12,bodyW*.25,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#202829";
  ctx.beginPath();ctx.arc(x,y-bodyH*.17,bodyW*.29,Math.PI,Math.PI*2);ctx.fill();
  rect(x-bodyW*.28,y-bodyH*.17,bodyW*.56,bodyH*.06,"#141a1b");

  // Gezondheidsindicator
  rect(x-bodyW*.35,y-bodyH*.34,bodyW*.7,4,"#161616");
  rect(x-bodyW*.35,y-bodyH*.34,bodyW*.7*(e.hp/2),4,"#c95042");
}
function drawGun(){
  const kick=recoil*12;
  polygon([
    [W*.43,H],[W*.45,H*.79+kick],[W*.55,H*.79+kick],
    [W*.59,H],[W*.43,H]
  ],"#202629");
  polygon([
    [W*.47,H*.83+kick],[W*.49,H*.72+kick],[W*.54,H*.72+kick],
    [W*.56,H*.89+kick],[W*.47,H*.89+kick]
  ],"#39413f");
  rect(W*.495,H*.695+kick,W*.045,30,"#171c1d");
  if(flash>0){
    polygon([[W*.5,H*.68+kick],[W*.46,H*.61+kick],[W*.5,H*.63+kick],[W*.54,H*.61+kick]],"#ffd778");
  }
}
function draw(){
  time=performance.now();
  ctx.clearRect(0,0,W,H);

  // Tavan, seinät en vloer van een trainingsruimte
  rect(0,0,W,H,"#323a39");
  polygon([[0,0],[W,0],[W*.75,H*.42],[W*.25,H*.42]],"#4b514c");
  polygon([[0,0],[W*.25,H*.42],[W*.25,H*.72],[0,H]],"#39413d");
  polygon([[W,0],[W*.75,H*.42],[W*.75,H*.72],[W,H]],"#353d3a");
  polygon([[0,H],[W,H],[W*.75,H*.42],[W*.25,H*.42]],"#65655a");

  // Vloer- en muurperspectief
  for(let i=1;i<9;i++){
    const t=i/9,y=H*.42+(H*.58)*t*t;
    ctx.strokeStyle="#ffffff16";ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }
  for(let i=0;i<=8;i++){
    const bx=W*i/8;
    ctx.strokeStyle="#ffffff12";
    ctx.beginPath();ctx.moveTo(W*.5+(bx-W*.5)*.35,H*.42);
    ctx.lineTo(bx,H);ctx.stroke();
  }

  // Deur en dekking
  rect(W*.39,H*.2,W*.22,H*.42,"#211f1b");
  rect(W*.405,H*.215,W*.19,H*.405,"#495149");
  rect(W*.425,H*.24,W*.15,H*.38,"#252c2a");
  rect(W*.55,H*.42,5,12,"#b38f52");
  rect(W*.08,H*.3,W*.12,H*.16,"#68716a");
  rect(W*.81,H*.3,W*.11,H*.16,"#68716a");
  rect(W*.04,H*.65,W*.2,H*.13,"#514b3d");
  rect(W*.77,H*.64,W*.19,H*.14,"#514b3d");

  for(const enemy of enemies)if(enemy.alive)drawEnemy(enemy);
  drawGun();

  if(moving){
    ctx.fillStyle="#dce4d5";
    ctx.font="bold 13px Arial";
    ctx.fillText("VOORZICHTIG VOORUIT",W/2-75,H*.66);
  }
  if(aiming){
    ctx.strokeStyle="#9dd4bd";
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(W/2,H/2,18,0,Math.PI*2);ctx.stroke();
  }
  if(flash>0)flash=Math.max(0,flash-.12);
  if(recoil>0)recoil=Math.max(0,recoil-.09);
  requestAnimationFrame(draw);
}

function update(now){
  const dt=Math.min((now-last)/16,2);last=now;
  if(!gameOver&&moving){
    // Vijanden nemen langzaam wat trainingsschade terug.
    for(const e of enemies){
      if(e.alive&&Math.random()<.0015*dt)health=Math.max(0,health-1);
    }
    if(health<=0){
      gameOver=true;
      message.innerHTML="MISSIE MISLUKT<br><small>Tik om opnieuw te beginnen</small>";
      message.style.display="block";
      message.onclick=()=>location.reload();
    }
    updateHUD();
  }
  requestAnimationFrame(update);
}
updateHUD();
requestAnimationFrame(draw);
requestAnimationFrame(update);
})();
</script>
</body>
</html>
