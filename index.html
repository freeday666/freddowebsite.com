<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oranjestad RP — Truck Game</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; }
    gmp-map-3d { display: block; width: 100%; height: 100%; }
    #info {
      position: fixed; z-index: 2; top: 14px; left: 14px;
      padding: 12px 16px; border-radius: 8px;
      color: white; background: #18232ddd; line-height: 1.5;
    }
    #info strong { color: #ff8a32; }
  </style>
</head>
<body>
  <div id="info">
    <strong>ORANJESTAD RP</strong><br>
    Rijden: W/A/S/D of pijltjestoetsen<br>
    Snelheid: <span id="speed">0</span>
  </div>

  <script>
    // Vervang met je eigen Google Maps API-sleutel.
    window.GOOGLE_MAPS_API_KEY = "JOUW_API_SLEUTEL";
    window.GOOGLE_MAPS_MAP_ID = "JOUW_MAP_ID";
  </script>
  <script src="game.js"></script>
</body>
</html>
