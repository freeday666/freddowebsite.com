<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discord-bot dashboard</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #10121a; color: #f5f5f7;
      font: 16px system-ui, sans-serif;
    }
    main {
      width: min(440px, calc(100% - 40px)); padding: 28px;
      border: 1px solid #303443; border-radius: 16px; background: #191c27;
    }
    h1 { margin-top: 0; }
    #status { color: #b7bdcc; }
    .online { color: #55d68b !important; }
    .offline { color: #ff7777 !important; }
    button {
      padding: 10px 14px; border: 0; border-radius: 9px;
      background: #5865f2; color: white; font: inherit; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Discord bot</h1>
    <p id="status">Status ophalen…</p>
    <button id="refresh">Vernieuwen</button>
  </main>

  <script>
    const status = document.querySelector("#status");

    async function updateStatus() {
      try {
        const response = await fetch("/api/status");
        if (!response.ok) throw new Error("Status ophalen mislukt");
        const data = await response.json();

        status.textContent = data.online
          ? `Online als ${data.username}`
          : "Offline";
        status.className = data.online ? "online" : "offline";
      } catch {
        status.textContent = "Kan de server niet bereiken.";
        status.className = "offline";
      }
    }

    document.querySelector("#refresh").addEventListener("click", updateStatus);
    updateStatus();
    setInterval(updateStatus, 15000);
  </script>
</body>
</html>
