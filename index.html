<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Truck Delivery Simulator</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <main id="game"></main>

  <section id="hud">
    <div><b>EURO TRUCK DELIVERY</b></div>
    <div id="mission">Missie: laad de vrachtwagen</div>
    <div>Snelheid: <span id="speed">0</span> km/u</div>
    <div>Afstand: <span id="distance">0</span> m</div>
  </section>

  <section id="map-panel">
    <div id="map"></div>
    <div id="map-status">Kaart laden…</div>
  </section>

  <section id="controls">
    <button data-key="left">◀</button>
    <button data-key="brake">Rem</button>
    <button data-key="accelerate">Gas</button>
    <button data-key="right">▶</button>
  </section>

  <section id="overlay">
    <div class="card">
      <h1 id="overlay-title">Truck Delivery Simulator</h1>
      <p id="overlay-text">
        Volg de route en rijd naar het afleverpunt. Gebruik WASD of de knoppen.
      </p>
      <button id="start">Start missie</button>
    </div>
  </section>

  <script type="module" src="./game.js"></script>

  <!-- Vervang DE_API_KEY door je Maps JavaScript API-key. -->
  <script async
    src="https://maps.googleapis.com/maps/api/js?key=DE_API_KEY&callback=initMap&v=weekly">
  </script>
  <script src="./script.js"></script>
</body>
</html>
