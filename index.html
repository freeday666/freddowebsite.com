<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discord-login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #1e1f22;
      color: #f2f3f5;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(90%, 420px);
      padding: 32px;
      text-align: center;
      background: #2b2d31;
      border-radius: 16px;
    }

    .login-button {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 20px;
      border-radius: 8px;
      background: #5865f2;
      color: white;
      font-weight: bold;
      text-decoration: none;
    }

    .login-button:hover {
      background: #4752c4;
    }

    #status {
      min-height: 24px;
      margin-top: 20px;
      color: #b5bac1;
    }
  </style>
</head>

<body>
  <main>
    <h1>Welkom</h1>
    <p>Log in met je Discord-account.</p>

    <!-- Vervang dit door je serveradres. -->
    <a
      class="login-button"
      href="https://JOUW-SERVER-DOMEIN/login"
    >
      Inloggen met Discord
    </a>

    <p id="status" aria-live="polite"></p>
  </main>

  <script>
    const status = document.getElementById("status");
    const params = new URLSearchParams(window.location.search);

    if (params.get("login") === "success") {
      status.textContent = "Je bent succesvol ingelogd.";

      // Haal de ingelogde gebruiker op bij je backend.
      fetch("https://JOUW-SERVER-DOMEIN/me", {
        credentials: "include"
      })
        .then(async (response) => {
          if (!response.ok) {
            throw new Error("Gebruikersgegevens ophalen is mislukt.");
          }
          return response.json();
        })
        .then((user) => {
          status.textContent =
            `Ingelogd als ${user.global_name || user.username}.`;
        })
        .catch((error) => {
          status.textContent = error.message;
        });

      // Verwijder de loginparameter uit de adresbalk.
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  </script>
</body>
</html>
