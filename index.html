
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oranjestad Roleplay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loading">Oranjestad Roleplay laden...</div>

  <div id="hud">
    <div class="brand">🇦🇼 ORANJESTAD RP</div>
    <div id="playerCount">Spelers: 1</div>
    <div id="status">Verbinden...</div>
    <button id="nameButton">Verander naam</button>
  </div>

  <div id="instructions">
    Beweeg met de joystick
  </div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <div id="actions">
    <button id="carButton">🚘 Auto</button>
    <button id="exitButton">🚶 Uitstappen</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
