<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Oranjestad Roleplay 3D - Freemode</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        /* UI Overlay */
        .hud { position: absolute; pointer-events: none; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        #speedometer { bottom: 20px; right: 20px; text-align: right; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(10px); padding: 15px 25px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); }
        .speed-val { font-size: 48px; font-weight: 800; font-family: monospace; color: #00f0ff; }
        .speed-unit { font-size: 14px; text-transform: uppercase; letter-spacing: 2px; color: #94a3b8; }
        
        /* Controls Overlay for Mobile */
        .touch-controls { position: absolute; bottom: 20px; left: 20px; display: flex; gap: 15px; pointer-events: auto; }
        .btn { width: 65px; height: 65px; background: rgba(255,255,255,0.15); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; color: #fff; font-weight: bold; font-size: 20px; display: flex; align-items: center; justify-content: center; active { background: rgba(0,240,255,0.4); } }
        .steer-group { display: flex; gap: 10px; }
        .pedal-group { position: absolute; bottom: 20px; right: 160px; display: flex; gap: 10px; pointer-events: auto; }
        
        /* Instructions Overlay */
        #instructions { top: 20px; left: 20px; background: rgba(15,23,42,0.7); backdrop-filter: blur(8px); padding: 12px 20px; border-radius: 12px; font-size: 13px; border: 1px solid rgba(255,255,255,0.1); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="instructions" class="hud">
        <strong>Oranjestad RP 3D</strong><br>
        W / S of 🡱 / 🡳 : Gas / Remmen<br>
        A / D of 🡰 / 🡲 : Sturen<br>
        Spatie : Handrem / Drift
    </div>

    <div id="speedometer" class="hud">
        <div class="speed-val" id="speed">0</div>
        <div class="speed-unit">KM/H</div>
    </div>

    <!-- Touch Controls voor Android -->
    <div class="touch-controls">
        <div class="btn" id="btn-left">🡰</div>
        <div class="btn" id="btn-right">🡲</div>
    </div>
    <div class="pedal-group">
        <div class="btn" id="btn-brake" style="background: rgba(239, 68, 68, 0.3);">🛑</div>
        <div class="btn" id="btn-gas" style="background: rgba(34, 197, 94, 0.3);">🟢</div>
    </div>

    <script>
        // Basic Three.js setup & World building
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(100, 150, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Ground / Road Grid
        const groundGeo = new THREE.PlaneGeometry(1000, 1000);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x2e3440 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Simple Vehicle Mesh Construction
        const car = new THREE.Group();
        
        const bodyGeo = new THREE.BoxGeometry(2, 0.8, 4);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00f0ff, metalness: 0.5, roughness: 0.2 });
        const carBody = new THREE.Mesh(bodyGeo, bodyMat);
        carBody.position.y = 0.6;
        car.add(carBody);

        const cabinGeo = new THREE.BoxGeometry(1.6, 0.6, 2);
        const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const cabin = new THREE.Mesh(cabinGeo, cabinMat);
        cabin.position.set(0, 1.2, -0.2);
        car.add(cabin);

        scene.add(car);

        // Controls Logic
        const keys = { w: false, a: false, s: false, d: false, space: false };
        let speed = 0;
        let angle = 0;
