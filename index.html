<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NovaDev Chat</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #0f172a;
      color: #e2e8f0;
      font: 16px/1.5 system-ui, sans-serif;
    }

    .chat {
      width: min(100%, 700px);
      height: min(80vh, 750px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #334155;
      border-radius: 16px;
      background: #111c32;
      box-shadow: 0 20px 60px #0005;
    }

    header {
      padding: 18px 22px;
      border-bottom: 1px solid #334155;
    }

    h1 { margin: 0; font-size: 1.2rem; }
    header p { margin: 4px 0 0; color: #94a3b8; font-size: .9rem; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      width: fit-content;
      max-width: 85%;
      margin: 0 0 14px;
      padding: 11px 14px;
      border-radius: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      margin-left: auto;
      background: #2563eb;
      color: white;
    }

    .assistant { background: #1e293b; }
    .error { color: #fecaca; }

    form {
      display: flex;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid #334155;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid #475569;
      border-radius: 10px;
      outline: none;
      background: #0f172a;
      color: white;
      font: inherit;
    }

    input:focus { border-color: #60a5fa; }

    button {
      padding: 0 18px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    button:disabled { opacity: .55; cursor: wait; }
  </style>
</head>

<body>
  <main class="chat">
    <header>
      <h1>NovaDev</h1>
      <p>Chat met Gemini</p>
    </header>

    <section id="messages" aria-live="polite">
      <div class="message assistant">Hoi! Waar kan ik je mee helpen?</div>
    </section>

    <form id="chat-form">
      <input id="message-input" type="text" placeholder="Typ je bericht..." autocomplete="off" required>
      <button id="send-button" type="submit">Verstuur</button>
    </form>
  </main>

  <script>
    const form = document.querySelector("#chat-form");
    const input = document.querySelector("#message-input");
    const button = document.querySelector("#send-button");
    const messages = document.querySelector("#messages");

    function addMessage(text, role, isError = false) {
      const element = document.createElement("div");
      element.className = `message ${role}${isError ? " error" : ""}`;
      element.textContent = text;
      messages.appendChild(element);
      messages.scrollTop = messages.scrollHeight;
      return element;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";
      input.disabled = true;
      button.disabled = true;

      const waiting = addMessage("Gemini denkt na…", "assistant");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });

        const text = await response.text();
        let data;

        try {
          data = JSON.parse(text);
        } catch {
          throw new Error(
            `Server gaf geen JSON terug (HTTP ${response.status}). ` +
            "Open de pagina via http://localhost:3000."
          );
        }

        if (!response.ok) {
          throw new Error(data.error || `Serverfout (${response.status}).`);
        }

        waiting.remove();
        addMessage(data.reply || "Geen antwoord ontvangen.", "assistant");
      } catch (error) {
        waiting.remove();
        addMessage(error.message || "Verbinding met de server mislukt.", "assistant", true);
      } finally {
        input.disabled = false;
        button.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
