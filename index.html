<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discord-login</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #1e1f22;
      color: #f2f3f5;
      font: 16px Arial, sans-serif;
    }
    main {
      width: min(90%, 380px);
      padding: 30px;
      text-align: center;
      background: #2b2d31;
      border-radius: 14px;
    }
    a {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 20px;
      border-radius: 8px;
      background: #5865f2;
      color: white;
      font-weight: bold;
      text-decoration: none;
    }
    #status { color: #b5bac1; }
  </style>
</head>
<body>
  <main>
    <h1>Welkom</h1>
    <p>Log in met je Discord-account.</p>
    <a href="/login">Inloggen met Discord</a>
    <p id="status" aria-live="polite"></p>
  </main>

  <script>
    fetch("/me", { credentials: "same-origin" })
      .then(response => response.ok ? response.json() : null)
      .then(user => {
        if (user) {
          document.getElementById("status").textContent =
            `Ingelogd als ${user.global_name || user.username}.`;
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
