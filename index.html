<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova — Discord-login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; padding: 24px;
      display: grid; place-items: center;
      background: #0b0b12; color: #f5f3ff;
      font: 16px system-ui, sans-serif;
    }
    main {
      width: min(100%, 440px); padding: 40px 30px;
      text-align: center; border: 1px solid #302b43;
      border-radius: 22px; background: #151420;
    }
    h1 { margin: 0 0 10px; }
    p { color: #b8b4c8; line-height: 1.5; }
    a {
      display: block; margin-top: 24px; padding: 14px;
      border-radius: 12px; background: #5865f2;
      color: white; font-weight: 700; text-decoration: none;
    }
    a:hover { background: #4752c4; }
    #status { min-height: 24px; }
  </style>
</head>
<body>
  <main>
    <h1>Nova</h1>
    <p id="status">Verbind je Discord-account om verder te gaan.</p>
    <a id="login" href="https://jouw-api.example.com/login">
      Doorgaan met Discord
    </a>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const status = document.getElementById("status");
    const login = document.getElementById("login");

    if (params.get("login") === "success") {
      const username = params.get("username");
      status.textContent = username
        ? `Ingelogd als ${username}.`
        : "Je Discord-account is verbonden.";
      login.hidden = true;

      // Verwijder loginstatus uit de adresbalk.
      history.replaceState({}, document.title, window.location.pathname);
    } else if (params.get("login") === "error") {
      status.textContent = "Inloggen is niet gelukt. Probeer het opnieuw.";
    }
  </script>
</body>
</html>
