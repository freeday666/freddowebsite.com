<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stadsbezorger 3D — Testdemo</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #101820;
      color: white;
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    .hud {
      position: fixed;
      z-index: 2;
      top: 16px;
      left: 16px;
      max-width: min(440px, calc(100vw - 32px));
      padding: 16px 18px;
      border: 1px solid #ffffff26;
      border-radius: 16px;
      background: #101820d9;
      box-shadow: 0 8px 32px #0005;
      backdrop-filter: blur(12px);
    }

    .hud h1 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    .hud p {
      margin: 5px 0;
      color: #d2dce5;
      font-size: 13px;
      line-height: 1.5;
    }

    #status {
      color: #7cf5b0;
      font-weight: 700;
    }

    .discord {
      display: inline-block;
      margin-top: 8px;
      color: #a9baff;
      font-size: 13px;
    }

    .touch-controls {
      position: fixed;
      z-index: 3;
      right: 16px;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 16px;
      display: none;
      justify-content: space-between;
      align-items: end;
      pointer-events: none;
    }

    .touch-group {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .touch-controls button {
      min-width: 58px;
      min-height: 58px;
      padding: 10px;
      border: 1px solid #ffffff55;
      border-radius: 18px;
      background: #101820cc;
      color: white;
      font: 700 14px system-ui, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .touch-controls button:active {
      background: #4a79ffcc;
      transform: scale(.96);
    }

    @media (pointer: coarse) {
      .touch-controls { display: flex; }
      .hud { top: 10px; left: 10px; padding: 12px; }
      .hud p { font-size: 12px; }
    }
  </style>
</head>

<body>
  <section class="hud">
    <h1>🚚 Stadsbezorger 3D</h1>
    <p>Rijd met <b>WASD</b> of de pijltjes. Druk <b>V</b> voor de bestuurderscamera achter het stuur.</p>
    <p><b>E</b>: in-/uitstappen · <b>U</b>: laadklep · <b>V</b>: camera wisselen</p>
    <p id="status">Je zit achter het stuur. Start de rit!</p>
    <a class="discord" href="https://discord.gg/cuXRe4PUgJ" target="_blank" rel="noopener noreferrer">
      Join onze Discord
    </a>
  </section>

  <div class="touch-controls" aria-label="Mobiele bediening">
    <div class="touch-group">
      <button data-key="arrowleft" aria-label="Links">◀</button>
      <button data-key="arrowright" aria-label="Rechts">▶</button>
    </div>
    <div class="touch-group">
      <button data-key="arrowdown">REM</button>
      <button data-key="arrowup">GAS</button>
      <button id="cameraButton">CAM</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9ed7ef);
    scene.fog = new THREE.Fog(0x9ed7ef, 70, 230);

    const camera = new THREE.PerspectiveCamera(
      72,
      window.innerWidth / window.innerHeight,
      0.1,
      500
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x52604a, 2));
    const sunlight = new THREE.DirectionalLight(0xffffff, 2.3);
    sunlight.position.set(-35, 65, 30);
    sunlight.castShadow = true;
    scene.add(sunlight);

    const mat = (color, roughness = 0.85) =>
      new THREE.MeshStandardMaterial({ color, roughness });

    const grassMaterial = mat(0x72a85c);
    const roadMaterial = mat(0x343a40);
    const lineMaterial = mat(0xf2e8bf);
    const buildingColors = [0xe9b979, 0xd78668, 0xd9d6c5, 0x9eb7a1, 0xd8bfdd];

    function box(name, x, y, z, sx, sy, sz, material, parent = scene) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(sx, sy, sz),
        material
      );
      mesh.name = name;
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    // Grond en lange weg.
    box("gras", 0, -0.25, 0, 200, 0.5, 300, grassMaterial);
    box("weg", 0, 0.02, 0, 12, 0.12, 300, roadMaterial);

    // Middenstreep.
    for (let z = -140; z < 150; z += 12) {
      box("wegmarkering", 0, 0.1, z, 0.18, 0.025, 6, lineMaterial);
    }

    // Eenvoudige huizen langs de weg.
    for (let z = -120; z <= 120; z += 24) {
      for (const side of [-1, 1]) {
        const height = 7 + Math.random() * 6;
        const color = buildingColors[
          Math.floor(Math.random() * buildingColors.length)
        ];
        box(
          "huis",
          side * (12 + Math.random() * 7),
          height / 2,
          z + Math.random() * 7,
          9,
          height,
          10,
          mat(color)
        );

        // Plat dak en een raam aan de straatkant.
        const houseX = side * (12 + 0); // raam is decoratief; huizen blijven eenvoudig
      }
    }

    // Bestelwagen: de wagen rijdt in de lengterichting van de weg (Z-as).
    const van = new THREE.Group();
    scene.add(van);

    const bodyMaterial = mat(0xe9f0f3, 0.45);
    const darkMaterial = mat(0x202a32, 0.4);
    const glassMaterial = new THREE.MeshStandardMaterial({
      color: 0x87c9df,
      roughness: 0.22,
      metalness: 0.12
    });

    box("carrosserie", 0, 1.25, 0, 2.5, 1.5, 5, bodyMaterial, van);
    box("cabine", 0, 2.15, -1.25, 2.35, 1.2, 2.25, bodyMaterial, van);
    box("voorruit", 0, 2.3, -2.38, 1.9, 0.72, 0.08, glassMaterial, van);
    box("bumper", 0, 0.65, -2.55, 2.45, 0.3, 0.25, darkMaterial, van);

    // Dashboard en stuur zijn zichtbaar in de bestuurderscamera.
    box("dashboard", 0, 1.75, -2.05, 1.85, 0.25, 0.7, darkMaterial, van);

    const steeringWheel = new THREE.Mesh(
      new THREE.TorusGeometry(0.28, 0.045, 10, 24),
      darkMaterial
    );
    steeringWheel.position.set(-0.55, 1.95, -1.88);
    van.add(steeringWheel);

    const wheels = [];
    for (const x of [-1.3, 1.3]) {
      for (const z of [-1.65, 1.65]) {
        const wheel = new THREE.Mesh(
          new THREE.CylinderGeometry(0.48, 0.48, 0.28, 20),
          darkMaterial
        );
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(x, 0.55, z);
        wheel.castShadow = true;
        van.add(wheel);
        wheels.push(wheel);
      }
    }

    // Laadklep achter de bestelwagen.
    const tailgate = box(
      "laadklep",
      0,
      0.95,
      2.55,
      2.2,
      0.12,
      0.9,
      darkMaterial,
      van
    );

    // Bezorgbestemming.
    const marker = new THREE.Mesh(
      new THREE.CylinderGeometry(1.35, 1.35, 0.08, 32),
      new THREE.MeshStandardMaterial({
        color: 0x35e58a,
        emissive: 0x0a6b35,
        transparent: true,
        opacity: 0.8
      })
    );
    marker.position.set(0, 0.12, -55);
    scene.add(marker);

    const keys = new Set();
    let speed = 0;
    let steering = 0;
    let driving = true;
    let cameraMode = "chase";
    let gateOpen = false;

    const status = document.querySelector("#status");

    function setCameraMode() {
      cameraMode = cameraMode === "cockpit" ? "chase" : "cockpit";
      status.textContent = cameraMode === "cockpit"
        ? "Bestuurderscamera: achter het stuur."
        : "Volgcamera ingeschakeld.";
    }

    function onKeyDown(event) {
      const key = event.key.toLowerCase();
      if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)) {
        event.preventDefault();
      }
      keys.add(key);

      if (key === "v" && driving) setCameraMode();

      if (key === "e") {
        driving = !driving;
        status.textContent = driving
          ? "Je zit weer achter het stuur."
          : "Je bent uitgestapt.";
      }

      if (key === "u" && driving) {
        gateOpen = !gateOpen;
        tailgate.rotation.x = gateOpen ? -Math.PI / 2 : 0;
        status.textContent = gateOpen ? "Laadklep geopend." : "Laadklep gesloten.";
      }
    }

    function onKeyUp(event) {
      keys.delete(event.key.toLowerCase());
    }

    window.addEventListener("keydown", onKeyDown);
    window.addEventListener("keyup", onKeyUp);

    document.querySelectorAll("[data-key]").forEach((button) => {
      const key = button.dataset.key;
      const release = () => keys.delete(key);

      button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        keys.add(key);
        button.setPointerCapture(event.pointerId);
      });
      button.addEventListener("pointerup", release);
      button.addEventListener("pointercancel", release);
      button.addEventListener("lostpointercapture", release);
    });

    document.querySelector("#cameraButton").addEventListener("click", () => {
      if (driving) setCameraMode();
    });

    const clock = new THREE.Clock();
    const forward = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.04);

      if (driving) {
        if (keys.has("arrowup") || keys.has("w")) speed += 12 * dt;
        if (keys.has("arrowdown") || keys.has("s")) speed -= 16 * dt;
        if (!keys.has("arrowup") && !keys.has("w") &&
            !keys.has("arrowdown") && !keys.has("s")) {
          speed *= Math.pow(0.08, dt);
        }

        speed = THREE.MathUtils.clamp(speed, -10, 25);

        const turnLeft = keys.has("arrowleft") || keys.has("a");
        const turnRight = keys.has("arrowright") || keys.has("d");
        steering = THREE.MathUtils.damp(
          steering,
          (turnLeft ? 1 : 0) - (turnRight ? 1 : 0),
          8,
          dt
        );

        van.rotation.y += steering * speed * 0.018 * dt;
        forward.set(-Math.sin(van.rotation.y), 0, -Math.cos(van.rotation.y));
        van.position.addScaledVector(forward, speed * dt);

        wheels.forEach((wheel) => {
          wheel.rotation.x += speed * dt * 1.8;
        });
      }

      if (cameraMode === "cockpit" && driving) {
        // Kamera op ooghoogte, in de cabine, kijkend door de voorruit.
        const cockpitPosition = new THREE.Vector3(-0.48, 2.05, -1.72);
        van.localToWorld(cockpitPosition);
        camera.position.copy(cockpitPosition);

        const viewDirection = new THREE.Vector3(0, 0.02, -1)
          .applyQuaternion(van.quaternion);
        camera.lookAt(
          camera.position.clone().add(viewDirection.multiplyScalar(30))
        );
      } else {
        const chaseOffset = new THREE.Vector3(0, 5.5, 10)
          .applyQuaternion(van.quaternion);
        const targetPosition = van.position.clone().add(chaseOffset);
        camera.position.lerp(targetPosition, 1 - Math.pow(0.001, dt));
        camera.lookAt(van.position.x, van.position.y + 1.2, van.position.z);
      }

      marker.position.y = 0.13 + Math.sin(performance.now() * 0.002) * 0.08;
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
