
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dutch Driving Simulator</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#83b8dc;font-family:Arial}
canvas{display:block}
#hud{position:fixed;top:10px;left:10px;right:10px;
display:flex;justify-content:space-between;gap:6px;pointer-events:none}
.info{background:#142b3ddd;color:white;padding:10px;border-radius:12px;font-weight:bold}
#controls{position:fixed;bottom:15px;left:0;right:0;
display:flex;justify-content:space-between;padding:0 12px}
.group{display:flex;gap:8px}
button{background:#142b3ddd;color:white;border:1px solid #ffffff66;
border-radius:15px;min-width:58px;height:60px;font-size:17px;
font-weight:bold;touch-action:none}
button:active{background:#168bc2}
#menu{position:fixed;inset:0;background:#071521dd;
display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#19354a;color:white;padding:25px;
border-radius:20px;text-align:center;max-width:400px}
#start{background:#159bc9;padding:14px 25px}
</style>
</head>
<body>

<div id="hud">
 <div class="info" id="speed">0 km/u</div>
 <div class="info" id="mode">Auto</div>
 <div class="info" id="traffic">Groen</div>
</div>

<div id="controls">
 <div class="group">
  <button id="left">◀</button>
  <button id="right">▶</button>
 </div>
 <div class="group">
  <button id="exit">UIT/IN</button>
  <button id="brake">REM</button>
  <button id="gas">GAS</button>
 </div>
</div>

<div id="menu">
 <div class="card">
  <h1>🇳🇱 Dutch Driving Simulator</h1>
  <p>Rijd door een Nederlandse omgeving, volg de verkeerslichten en stap uit je auto.</p>
  <p>Bediening: gas, rem, links, rechts en UIT/IN.</p>
  <button id="start">START RIJDEN</button>
 </div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91c8e9);
scene.fog=new THREE.Fog(0x91c8e9,80,240);

const camera=new THREE.PerspectiveCamera(
65,innerWidth/innerHeight,0.1,500);

const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x667755,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-30,50,20);
scene.add(sun);

function material(color){
 return new THREE.MeshStandardMaterial({color,roughness:1});
}
const grass=material(0x6b9b57);
const road=material(0x33383d);
const white=material(0xffffff);
const brick=material(0xc47c58);
const roof=material(0x45474b);
const glass=material(0x75b9d3);
const black=material(0x15191d);

function box(x,y,z,w,h,d,m,parent=scene){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
 o.position.set(x,y,z);
 parent.add(o);
 return o;
}

// Nederlandse omgeving
box(0,-.3,0,250,.5,250,grass);
box(0,0,0,12,.1,250,road);

for(let z=-120;z<130;z+=12){
 box(0,.07,z,.14,.02,6,white);
}

for(let x of [-7,7]){
 box(x,.02,0,1,.05,250,material(0xb8b8b8));
}

// Nederlandse huizen
for(let z=-110;z<120;z+=22){
 for(let side of [-1,1]){
  let x=side*17;
  box(x,3,z,9,6,10,brick);
  box(x,6.5,z,9.5,1,10.5,roof);
  box(x,2.5,z+5,1.5,2.5,.1,glass);
  box(x-2,4,z+5,1.5,1.5,.1,glass);
 }
}

// Auto
const car=new THREE.Group();
scene.add(car);

box(0,.75,0,2,1,4,material(0x1267b2),car);

const cabin=box(0,1.55,-.25,1.55,.75,1.9,glass,car);

for(let x of [-1,1]){
 for(let z of [-1.35,1.35]){
  const wheel=new THREE.Mesh(
   new THREE.CylinderGeometry(.38,.38,.22,12),black);
  wheel.rotation.z=Math.PI/2;
  wheel.position.set(x,.42,z);
  car.add(wheel);
 }
}

car.position.set(0,0,20);

// Verkeerslicht
box(5,2.7,-35,.22,5.4,.22,black);
box(4.5,5.4,-35,1.2,2.5,.45,black);

const lamps=[];
const colors=[0xe52d2d,0xffb323,0x21c65b];

for(let i=0;i<3;i++){
 const lamp=new THREE.Mesh(
  new THREE.SphereGeometry(.28,12,8),
  material(colors[i]));
 lamp.position.set(4.5,6.15-i*.75,-35.25);
 scene.add(lamp);
 lamps.push(lamp);
}

let lightState=2;
let lightTimer=0;

let speed=0;
let heading=0;
let driving=true;
let walk=new THREE.Vector3();
const keys={};

function toggle(){
 if(driving){
  driving=false;
  walk.copy(car.position);
  walk.x+=2.2;
 }else{
  if(walk.distanceTo(car.position)<5){
   driving=true;
  }
 }
}

document.getElementById('exit').onclick=toggle;
document.getElementById('start').onclick=()=>{
 document.getElementById('menu').style.display='none';
};

addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key.toLowerCase()==='e')toggle();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function hold(id,key){
 const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{
  e.preventDefault();
  keys[key]=true;
 });
 for(const ev of ['pointerup','pointerleave','pointercancel']){
  b.addEventListener(ev,()=>keys[key]=false);
 }
}
hold('left','left');
hold('right','right');
hold('gas','gas');
hold('brake','brake');

function update(dt){
 lightTimer+=dt;
 if(lightTimer>7){
  lightTimer=0;
  lightState=(lightState+1)%3;
 }
 lamps.forEach((lamp,i)=>{
  lamp.material=material(i===lightState?colors[i]:0x252525);
 });

 if(driving){
  if(keys.gas||keys.w||keys.arrowup)speed+=13*dt;
  else speed-=5*dt;

  if(keys.brake||keys.s||keys.arrowdown)speed-=24*dt;
  speed=Math.max(-8,Math.min(32,speed));

  let turn=
   (keys.left||keys.a||keys.arrowleft?-1:0)+
   (keys.right||keys.d||keys.arrowright?1:0);

  heading+=turn*dt*(.8+Math.abs(speed)*.035);
  car.rotation.y=heading;

  car.position.x+=Math.sin(heading)*speed*dt;
  car.position.z-=Math.cos(heading)*speed*dt;
  car.position.x=Math.max(-4.2,Math.min(4.2,car.position.x));

  camera.position.set(
   car.position.x-Math.sin(heading)*8,
   5.2,
   car.position.z+Math.cos(heading)*8
  );
  camera.lookAt(car.position.x,1.2,car.position.z-4);

 }else{
  let f=(keys.w||keys.arrowup?1:0)-
        (keys.s||keys.arrowdown?1:0);
  let t=(keys.left?-1:0)+(keys.right?1:0);

  walk.x+=t*dt*5;
  walk.z-=f*dt*5;

  camera.position.set(walk.x,2.2,walk.z+5);
  camera.lookAt(walk.x,1.4,walk.z-3);
  speed=0;
 }

 document.getElementById('speed').textContent=
  Math.round(Math.abs(speed)*3.6)+' km/u';

 document.getElementById('mode').textContent=
  driving?'In de auto':'Te voet';

 document.getElementById('traffic').textContent=
  ['Rood','Oranje','Groen'][lightState];
}

let last=performance.now();

function animate(now){
 const dt=Math.min((now-last)/1000,.04);
 last=now;
 update(dt);
 renderer.render(scene,camera);
 requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
