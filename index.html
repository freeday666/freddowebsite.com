<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171522">
  <title>Freddo Website — Discord-login</title>

  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: #171522;
      color: #f5f3ff;
      font: 16px/1.5 system-ui, sans-serif;
    }

    main {
      width: min(100%, 440px);
      padding: 32px;
      text-align: center;
      background: #242132;
      border: 1px solid #3b3650;
      border-radius: 18px;
      box-shadow: 0 18px 60px #0005;
    }

    h1 { margin: 0 0 10px; }
    p { color: #c5c0d5; }

    .button {
      display: block;
      margin-top: 24px;
      padding: 14px 18px;
      border-radius: 10px;
      background: #5865f2;
      color: white;
      font-weight: 700;
      text-decoration: none;
    }

    .button:hover { background: #4752c4; }
    .note { margin-top: 20px; font-size: 13px; }
    #status { min-height: 24px; margin-top: 16px; color: #c4b5fd; }
  </style>
</head>

<body>
  <main>
    <h1>Inloggen met Discord</h1>
    <p>Log in om verder te gaan naar Freddo Website.</p>

    <a id="discord-login" class="button" href="#">
      Inloggen met Discord
    </a>

    <p id="status" role="status" aria-live="polite"></p>

    <p class="note">
      Voor OAuth is een publieke backend-callback nodig. Een localhost-callback
      werkt niet voor bezoekers van deze website.
    </p>
  </main>

  <script>
    const SITE_URL = "https://freeday666.github.io/freddowebsite.com/";

    // Vervang dit door je publieke backend-callback, bijvoorbeeld:
    // https://jouw-backend.example.com/callback
    const CALLBACK_URL = "https://VUL-HIER-JE-PUBLIEKE-BACKEND-URL-IN/callback";

    const params = new URLSearchParams({
      client_id: "1546170500282064976",
      response_type: "code",
      redirect_uri: CALLBACK_URL,
      scope: "identify guilds.join"
    });

    document.getElementById("discord-login").href =
      "https://discord.com/oauth2/authorize?" + params.toString();

    const query = new URLSearchParams(location.search);
    const status = document.getElementById("status");

    if (query.get("login") === "success") {
      status.textContent = "Je bent succesvol ingelogd.";
      history.replaceState({}, document.title, SITE_URL);
    } else if (query.has("error")) {
      status.textContent = "Inloggen is niet gelukt: " + query.get("error");
    }
  </script>
</body>
</html>
